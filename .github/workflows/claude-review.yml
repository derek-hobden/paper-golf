name: Claude review

# Every pull request to main is reviewed by Claude against the repo's own rules
# (AGENTS.md, README.md and REVIEW.md). The job is one of main's required
# status checks: it fails when the review leaves a blocking comment.
#
# pull_request_target runs this file from the default branch, not from the pull
# request. A pull request that edits .github/workflows or scripts/claude-review.mjs
# cannot replace the job or the script: the checkout is the base commit, and the
# reviewer is `git show` of that commit. The head is fetched only so the diff can
# be read. Nothing from the head is executed, and the API key is handed only to
# that base copy. A by-hand refresh dispatches this workflow on main and records the
# check on the pull request's head.
#
# The key is the repo secret ANTHROPIC_API_KEY, read from that secret only and
# never printed. The job fails with a clear error when it is missing. When the
# review step fails, is skipped, or leaves no verdict file, scripts/ship/review-status.sh
# posts one sticky comment. A run whose GITHUB_TOKEN cannot write it says why in
# the step summary instead. Nothing here deploys. AGENTS.md "Ship process".
#
# The review costs money, so it runs only on a ready mark — opened as a
# non-draft, marked ready for review, or the `ready` label added — never on a
# push. scripts/ship/paid-trigger.sh is that decision, and the explainer video
# uses the same one. A push after the review is covered by the Ready gate
# (.github/workflows/ready-gate.yml), which is the required check and spends
# nothing; when this job is done it re-runs the gate's failed or cancelled run
# for the head (scripts/ship/rerun-failed.sh, on this job's GITHUB_TOKEN with
# actions: write), so the gate's own red turns green, and dispatches the gate
# only when there is no run to re-run. AGENTS.md "Paid jobs".
on:
  pull_request_target:
    types: [opened, ready_for_review, labeled, synchronize]
    branches: [main]
  # A by-hand re-run, and the only other way to pay for a review.
  workflow_dispatch:
    inputs:
      refresh_pr:
        description: Pull request number whose review to re-run
        required: true
        type: string

# Keyed on the label for a `labeled` event: this job's own last steps set a
# `risk:` label, which raises one, and with a single group per pull request
# that event would cancel the run that raised it — losing the check run it
# records on the head and the gate dispatch that follows. Every other run has a
# group of its own; the paid job below holds the per-pull-request one.
concurrency:
  group: >-
    claude-review-${{ github.event.pull_request.number || inputs.refresh_pr }}-${{
      github.event.action == 'labeled' && github.event.label.name || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap, and separate, so the paid job below gates on a rule with tests
  # rather than on an expression nobody can run (scripts/ship/paid-trigger.sh).
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Reads for review-state.sh; issues and pull-requests write to take the
    # review-passed label off a push the pass does not cover (run 40627450344).
    permissions:
      contents: read
      pull-requests: write
      checks: read
      issues: write
    outputs:
      paid: ${{ steps.trigger.outputs.paid }}
      person: ${{ steps.trigger.outputs.person }}
      max_rounds: ${{ steps.trigger.outputs.max_rounds }}
      next_round: ${{ steps.state.outputs.next_round }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 1
      # Where the review stands (base copy, the run's token).
      - id: state
        env:
          GH_TOKEN: ${{ github.token }}
          SHIP_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || inputs.refresh_pr }}
        run: |
          set -euo pipefail
          # A failed read buys nothing: no live head is no review.
          bash scripts/ship/review-state.sh || {
            echo "::warning::could not read where the Claude review stands; a push will not start one"
            printf 'state=unknown\nround=0\nhead=\n' >>"$GITHUB_OUTPUT"
          }
          round="$(sed -n 's/^round=//p' "$GITHUB_OUTPUT" | tail -n 1)"
          echo "next_round=$(( ${round:-0} + 1 ))" >>"$GITHUB_OUTPUT"
      # A push the pass does not cover loses the review-passed label.
      - name: a push the pass does not cover loses the label
        if: github.event.action == 'synchronize' && steps.state.outputs.state != 'passed'
        env:
          GH_TOKEN: ${{ github.token }}
          SHIP_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          . scripts/ship/lib.sh
          ship_drop_label "$PR" "$SHIP_REVIEW_PASSED_LABEL"
      - id: trigger
        env:
          PAID_REVIEW_STATE: ${{ steps.state.outputs.state }}
          PAID_ROUND: ${{ steps.state.outputs.round }}
          PAID_COVERED: ${{ steps.state.outputs.covered }}
          # An older push or a re-run of an old run is not the newest event.
          PAID_EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          PAID_LIVE_HEAD: ${{ steps.state.outputs.head }}
          PAID_EVENT: ${{ github.event_name }}
          PAID_ACTION: ${{ github.event.action }}
          PAID_LABEL: ${{ github.event.label.name }}
          PAID_DRAFT: ${{ github.event.pull_request.draft }}
          PAID_AUTHOR: ${{ github.event.pull_request.user.login }}
          PAID_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PAID_REPO: ${{ github.repository }}
        run: bash scripts/ship/paid-trigger.sh

  # At the round cap the sticky comment says a person has to look.
  needs-a-person:
    needs: decide
    if: needs.decide.outputs.person == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The note goes on the sticky comment; review-status.sh person fails the job
    # when it cannot read or write it.
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 1
      - name: say a person has to look
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          # The cap paid-trigger.sh stopped at, so the note and the rule agree.
          ROUND: ${{ needs.decide.outputs.max_rounds }}
        run: bash scripts/ship/review-status.sh person

  claude-review:
    needs: decide
    if: >-
      needs.decide.outputs.paid == 'yes' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One paid review per pull request: a newer one cancels the older. A run
    # whose decide said no, and a re-run attempt (its decide is old), take a
    # group of their own and cancel nothing.
    concurrency:
      group: claude-review-paid-${{ github.event.pull_request.number || inputs.refresh_pr }}-${{ needs.decide.outputs.paid == 'yes' && github.run_attempt == 1 && 'paid' || github.run_id }}
      cancel-in-progress: true
    # actions: write is for re-running the Ready gate's failed run at the end;
    # the Golf Gus app has no Actions permission, so it is this job's token.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
      checks: write
    steps:
      # Before the checkout: the base sha has to be known without running a
      # file from the pull request. The jq is this workflow's, on main.
      - name: the pull request's commits
        id: commits
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.refresh_pr }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [ -z "$HEAD" ]; then
            line="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '"\(.base.sha) \(.head.sha)"')"
            BASE="${line%% *}"
            HEAD="${line##* }"
          fi
          case "$BASE" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
            *) echo "base is not a commit sha" >&2; exit 1 ;;
          esac
          case "$HEAD" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
            *) echo "head is not a commit sha" >&2; exit 1 ;;
          esac
          # A re-run keeps its old event; reviewing a head that is gone would
          # record a verdict for nobody.
          if [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then
            live="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.head.sha')"
            [ "$live" = "$HEAD" ] || {
              echo "::error::this re-run is for ${HEAD:0:7}, and the head is now ${live:0:7}; re-run the newest run or add the ready label"
              exit 1
            }
          fi
          {
            echo "base=$BASE"
            echo "head=$HEAD"
            echo "sha7=${HEAD:0:7}"
            echo "pr=$PR"
          } >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.commits.outputs.base }}
          fetch-depth: 0

      - name: fetch the pull request head
        env:
          HEAD: ${{ steps.commits.outputs.head }}
          PR: ${{ steps.commits.outputs.pr }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "pull/${PR}/head"
          git cat-file -e "$HEAD^{commit}"

      - id: fields
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.refresh_pr }}
        run: bash scripts/ship/pr-refresh-fields.sh

      - name: the review secret must be set
        id: secret
        env:
          HAS_TOKEN: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          set -euo pipefail
          [ "$HAS_TOKEN" = true ] || {
            echo "::error::repo secret ANTHROPIC_API_KEY is not set: add it under Settings → Secrets and variables → Actions, then re-run this job"
            exit 1
          }

      - name: label the risk from the diff
        id: risk
        env:
          BASE: ${{ steps.commits.outputs.base }}
          HEAD: ${{ steps.commits.outputs.head }}
        run: |
          set -euo pipefail
          verdict="$(bash scripts/ship/pr-risk.sh "$BASE" "$HEAD")"
          printf '%s\n' "$verdict"
          printf '%s\n' "$verdict" | grep -E '^(risk|lines)=' >>"$GITHUB_OUTPUT"
          {
            echo "### Auto-merge risk"
            printf '%s\n' "$verdict" | sed 's/^/    /'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: review the diff against the repo rules
        id: review
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE: ${{ steps.commits.outputs.base }}
          HEAD: ${{ steps.commits.outputs.head }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.refresh_pr }}
          PR_TITLE: ${{ github.event.pull_request.title || steps.fields.outputs.title }}
          PR_BODY: ${{ github.event.pull_request.body || steps.fields.outputs.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || steps.fields.outputs.author }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type || steps.fields.outputs.author_type }}
          GH_TOKEN: ${{ github.token }}
          # This review's round, for the findings file.
          REVIEW_ROUND: ${{ needs.decide.outputs.next_round }}
          REVIEW_LOG: ${{ runner.temp }}/claude-review.log
        run: |
          set -euo pipefail
          log="$REVIEW_LOG"
          : >"$log"
          if ! git cat-file -e "$BASE:scripts/claude-review.mjs"; then
            printf '%s\n' 'the reviewer script is not on the base commit' | tee "$log"
            exit 1
          fi
          git show "$BASE:scripts/claude-review.mjs" >"$RUNNER_TEMP/claude-review.mjs"
          # The reviewer is only ever the base copy above. Never run
          # scripts/claude-review.mjs from this pull request: that file would
          # then see the API key and the token. pull_request_target already
          # pinned this workflow to the default branch, so an edit of the
          # workflow file is reviewed by this copy rather than skipped.
          node "$RUNNER_TEMP/claude-review.mjs" 2>&1 | tee -a "$log"

      - name: read the review verdict
        id: verdict
        if: steps.review.outcome == 'success'
        run: |
          set -euo pipefail
          f=claude-review-verdict.json
          if [ ! -f "$f" ]; then
            echo "present=0" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=1" >>"$GITHUB_OUTPUT"
          VERDICT="$(cat "$f")" node -e '
            const v = JSON.parse(process.env.VERDICT ?? "{}");
            const n = Number(v.blocking ?? 1);
            console.log("blocking=" + (Number.isInteger(n) && n >= 0 ? n : 1));
            console.log("summary=" + String(v.summary ?? "").replace(/\s+/g, " ").slice(0, 300));
            // A review of a cut diff read part of the change: never a pass.
            console.log("incomplete=" + (v.incomplete === true ? 1 : 0));
            console.log("reviewed_chars=" + (Number.isInteger(v.reviewedChars) ? v.reviewedChars : ""));
            console.log("total_chars=" + (Number.isInteger(v.totalChars) ? v.totalChars : ""));
          ' >>"$GITHUB_OUTPUT"

      # The findings as data, for the problems list and the video's counts.
      - name: keep the findings
        if: ${{ !cancelled() && steps.verdict.outputs.present == '1' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-review-findings-${{ steps.commits.outputs.pr }}-${{ steps.commits.outputs.sha7 }}
          path: claude-review-findings.json
          retention-days: 30
          if-no-files-found: ignore

      # passed, changes-requested or broke (did not finish: not a round).
      - name: the review's outcome
        id: outcome
        if: ${{ !cancelled() }}
        env:
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          VERDICT_OUTCOME: ${{ steps.verdict.outcome }}
          PRESENT: ${{ steps.verdict.outputs.present }}
          BLOCKING: ${{ steps.verdict.outputs.blocking }}
          INCOMPLETE: ${{ steps.verdict.outputs.incomplete }}
        run: |
          set -euo pipefail
          state=broke
          if [ "$REVIEW_OUTCOME" = success ] && [ "$VERDICT_OUTCOME" = success ] && [ "$PRESENT" = 1 ]; then
            state=changes-requested
            [ "$BLOCKING" != 0 ] || state=passed
          fi
          # A review of a cut diff read part of the change: it is neither a pass
          # nor a round, so it counts as broke and the label stays as it was.
          [ "$INCOMPLETE" != 1 ] || [ "$state" != passed ] || state=broke
          echo "state=$state" >>"$GITHUB_OUTPUT"

      - name: post the review status
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.refresh_pr }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          SECRET_OUTCOME: ${{ steps.secret.outcome }}
          VERDICT_OUTCOME: ${{ steps.verdict.outcome }}
          PRESENT: ${{ steps.verdict.outputs.present }}
          BLOCKING: ${{ steps.verdict.outputs.blocking }}
          INCOMPLETE: ${{ steps.verdict.outputs.incomplete }}
          REVIEWED_CHARS: ${{ steps.verdict.outputs.reviewed_chars }}
          TOTAL_CHARS: ${{ steps.verdict.outputs.total_chars }}
          BASE: ${{ steps.commits.outputs.base }}
          HEAD: ${{ steps.commits.outputs.head }}
          REVIEW_LOG: ${{ runner.temp }}/claude-review.log
          # The problems list on a block, the round and what was fixed on a pass.
          FINDINGS: claude-review-findings.json
        run: |
          set -euo pipefail
          if [ "$REVIEW_OUTCOME" = success ] && [ "$VERDICT_OUTCOME" = success ] && [ "$PRESENT" = 1 ] && [ "$BLOCKING" = 0 ] && [ "$INCOMPLETE" = 1 ]; then
            bash scripts/ship/review-status.sh incomplete
            exit 0
          fi
          if [ "$REVIEW_OUTCOME" = success ] && [ "$VERDICT_OUTCOME" = success ] && [ "$PRESENT" = 1 ] && [ "$BLOCKING" = 0 ]; then
            bash scripts/ship/review-status.sh pass
            exit 0
          fi
          if [ "$REVIEW_OUTCOME" = success ] && [ "$VERDICT_OUTCOME" = success ] && [ "$PRESENT" = 1 ]; then
            bash scripts/ship/review-status.sh blocked
            exit 0
          fi
          names="$(git diff --name-only "$BASE...$HEAD" 2>/dev/null || true)"
          WORKFLOW_CHANGED=0
          if grep -qx '.github/workflows/claude-review.yml' <<<"$names" || grep -qx 'scripts/claude-review.mjs' <<<"$names"; then
            WORKFLOW_CHANGED=1
          fi
          export WORKFLOW_CHANGED
          if [ "$PRESENT" = 0 ]; then
            export VERDICT_PRESENT=0
          else
            export VERDICT_PRESENT=1
          fi
          bash scripts/ship/review-status.sh explain

      # review-passed: the app adds it (a GITHUB_TOKEN label starts no
      # workflow), off and on again on a pass so `labeled` fires; off on a
      # block; a broken review, or no state at all, leaves it.
      # v2, not v3: v3 deprecates app-id for client-id (as pr-video-publish.yml).
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: gus
        if: ${{ !cancelled() && steps.outcome.outputs.state != '' }}
        # A missing app secret is said in plain English by the label step below.
        continue-on-error: true
        with:
          app-id: ${{ secrets.GOLF_GUS_APP_ID }}
          private-key: ${{ secrets.GOLF_GUS_APP_KEY }}
      - name: the review-passed label
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.gus.outputs.token }}
          PR: ${{ steps.commits.outputs.pr }}
          STATE: ${{ steps.outcome.outputs.state }}
        run: |
          set -euo pipefail
          SHIP_REVIEW_PASSED_LABEL="$(. scripts/ship/lib.sh && printf '%s' "$SHIP_REVIEW_PASSED_LABEL")"
          case "$STATE" in passed | changes-requested) ;; *) exit 0 ;; esac
          SHIP_REPO="$GITHUB_REPOSITORY" bash -c '. scripts/ship/lib.sh && ship_drop_label "$1" "$2"' _ "$PR" "$SHIP_REVIEW_PASSED_LABEL"
          [ "$STATE" = passed ] || exit 0
          if [ -z "$APP_TOKEN" ]; then
            echo "::warning::the review passed, but there is no Golf Gus Bot app token (GOLF_GUS_APP_ID and GOLF_GUS_APP_KEY, in the Actions and Dependabot stores), so the ${SHIP_REVIEW_PASSED_LABEL} label is not added and no video starts"
            exit 0
          fi
          GH_TOKEN="$APP_TOKEN" gh api --method POST "/repos/${GITHUB_REPOSITORY}/issues/${PR}/labels" \
            -f "labels[]=${SHIP_REVIEW_PASSED_LABEL}" >/dev/null

      # The label is informational. The Auto-merge workflow turns auto-merge on
      # for every open pull request; this job does not.
      - name: label the PR risk
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.refresh_pr }}
          RISK_LEVEL: ${{ steps.risk.outputs.risk }}
        run: |
          set -euo pipefail
          gh label create risk:low --color 0e8a16 --description "the diff stays inside the auto-merge rules (AGENTS.md)" --force
          gh label create risk:high --color b60205 --description "the diff touches the ship rules (AGENTS.md)" --force
          gh pr edit "$PR" --remove-label risk:low --remove-label risk:high || true
          gh pr edit "$PR" --add-label "risk:$RISK_LEVEL"
          echo "risk:$RISK_LEVEL — every pull request is set to auto-merge. GitHub squash-merges it and deletes the branch once check, smoke, claude-review and pr-video are green." >>"$GITHUB_STEP_SUMMARY"

      - name: the review must leave no blocking comment
        env:
          BLOCKING: ${{ steps.verdict.outputs.blocking }}
          SUMMARY: ${{ steps.verdict.outputs.summary }}
          INCOMPLETE: ${{ steps.verdict.outputs.incomplete }}
          REVIEWED_CHARS: ${{ steps.verdict.outputs.reviewed_chars }}
          TOTAL_CHARS: ${{ steps.verdict.outputs.total_chars }}
        run: |
          set -euo pipefail
          if [ "$INCOMPLETE" = 1 ]; then
            echo "::error::the review was incomplete: the diff is $TOTAL_CHARS characters and it read the first $REVIEWED_CHARS"
            echo "The review was incomplete: the diff is $TOTAL_CHARS characters and it read the first $REVIEWED_CHARS, so it is not a pass." >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          [ "$BLOCKING" = 0 ] || {
            echo "::error::the review left $BLOCKING blocking comment(s): $SUMMARY"
            echo "The review left $BLOCKING blocking comment(s): $SUMMARY" >>"$GITHUB_STEP_SUMMARY"
            exit 1
          }
          echo "The review left no blocking comment." >>"$GITHUB_STEP_SUMMARY"

      # On every path, not only the dispatch: the Ready gate reads this check
      # run off the pull request's commits to decide whether the review has
      # passed since the pull request was last marked ready, and a
      # pull_request_target run records its own status against the base commit
      # instead. Recording it here puts the verdict where both can find it.
      - name: record the review on the pull request head
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ steps.commits.outputs.head }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          VERDICT_OUTCOME: ${{ steps.verdict.outcome }}
          PRESENT: ${{ steps.verdict.outputs.present }}
          BLOCKING: ${{ steps.verdict.outputs.blocking }}
          # The title says which, and scripts/ship/review-state.sh reads it:
          # `Claude review: passed`, `changes requested` or `broke`.
          STATE: ${{ steps.outcome.outputs.state }}
          INCOMPLETE: ${{ steps.verdict.outputs.incomplete }}
          REVIEWED_CHARS: ${{ steps.verdict.outputs.reviewed_chars }}
          TOTAL_CHARS: ${{ steps.verdict.outputs.total_chars }}
        run: |
          set -euo pipefail
          conclusion=failure
          summary="The Claude review did not pass."
          # A review of a cut diff is never recorded as a pass, so ready-gate,
          # which counts only a successful claude-review check run, stays red.
          if [ "$INCOMPLETE" = 1 ]; then
            summary="The Claude review was incomplete: the diff is $TOTAL_CHARS characters and it read the first $REVIEWED_CHARS."
          elif [ "$REVIEW_OUTCOME" = success ] && [ "$VERDICT_OUTCOME" = success ] && [ "$PRESENT" = 1 ] && [ "$BLOCKING" = 0 ] && [ "$INCOMPLETE" != 1 ]; then
            conclusion=success
            summary="The Claude review passed."
          fi
          state="${STATE:-broke}"
          [ "$conclusion" = success ] || [ "$state" != passed ] || state=broke
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -n --arg sha "$HEAD" --arg conclusion "$conclusion" --arg now "$now" --arg url "$url" --arg summary "$summary" \
            --arg state "${state//-/ }" \
            '{name:"claude-review", head_sha:$sha, status:"completed", conclusion:$conclusion, started_at:$now, completed_at:$now, details_url:$url, output:{title:("Claude review: " + $state), summary:$summary}}' \
            | gh api --method POST "/repos/${GITHUB_REPOSITORY}/check-runs" --input -

      # The one wake for whoever owns the pull request, posted by the app: the
      # review asked for changes (with the round and the problems list), or it
      # broke. Posted from here because a pull_request_target run carries no
      # pull request the PR signal workflow could find it by.
      - name: say the pull request is blocked
        if: always() && steps.outcome.outputs.state != '' && steps.outcome.outputs.state != 'passed'
        env:
          GH_TOKEN: ${{ steps.gus.outputs.token }}
          SHIP_REPO: ${{ github.repository }}
          PR: ${{ steps.commits.outputs.pr }}
          SIGNAL_WHAT: Claude review
          SIGNAL_REVIEW: ${{ steps.outcome.outputs.state }}
          SIGNAL_ROUND: ${{ needs.decide.outputs.next_round }}
          SIGNAL_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          bash scripts/ship/pr-signal.sh blocked ||
            echo "::warning::could not post the blocked signal on pull request $PR"

      # The Ready gate is the required check, and it may already have gone red
      # on this head (cancelled while it waited, or out of time). A new run
      # beside it would leave that red in the rollup, so its own failed run is
      # re-run now that the verdict above is recorded; the dispatch is only the
      # fallback when there is none. A refusal is a warning, never a red job.
      # Both of this workflow's events, on purpose: a by-hand dispatch is the
      # other way to pay for a review, and its verdict has to reach the gate
      # just the same. The step only touches failed or cancelled ready-gate
      # runs for this pull request's current head (rerun-failed.sh), so a
      # dispatch cannot re-run anything else. It needs the pull request number,
      # so it does not run when the first step never found one.
      - name: re-run the Ready gate's failed run for this head
        if: always() && steps.commits.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHIP_REPO: ${{ github.repository }}
          PR: ${{ steps.commits.outputs.pr }}
          WORKFLOW: ready-gate.yml
          EVENT: pull_request_target
          FALLBACK_INPUT: pr
        run: bash scripts/ship/rerun-failed.sh
