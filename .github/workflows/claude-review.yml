name: Claude review

# Every pull request to main is reviewed by Claude against the repo's own rules
# (CLAUDE.md, README.md and REVIEW.md). The job is one of main's required
# status checks: it fails when the review leaves a blocking comment, so a red
# review blocks the merge. It also labels the PR risk:low or risk:high by the
# auto-merge rules (scripts/ship/pr-risk.sh). GitHub's auto-merge is turned on
# from that label by .github/workflows/auto-merge.yml, which runs after this
# one, because this job's GITHUB_TOKEN is read-only on a pull request opened by
# Dependabot; everything else waits for Derek to approve and merge in GitHub. The review runs scripts/claude-review.mjs from the base commit, which
# calls the Anthropic Messages API. The key is the repo secret ANTHROPIC_API_KEY,
# read from that secret only and never printed; the job fails with a clear error
# when it is missing. A pull request that edits this workflow exits before that
# call, so it cannot rewrite its own reviewer. When the review step fails, is
# skipped, or leaves no verdict file, scripts/ship/review-status.sh posts one
# sticky comment with the reason in plain English (the same text in the step
# summary and the error annotation). Every later run updates that one comment:
# a review that passes, and one that leaves blocking comments, both refresh it.
# A run whose GITHUB_TOKEN cannot write it (a pull request opened by Dependabot
# gets a read-only one) says why in the step summary instead.
# Nothing here deploys. CLAUDE.md "Ship process".
on:
  pull_request:
    branches: [main]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  # Read this run's annotations so the status comment can quote them.
  actions: read

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Checkout first: a missing secret still has to run review-status.sh.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: the review secret must be set
        id: secret
        env:
          HAS_TOKEN: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          set -euo pipefail
          [ "$HAS_TOKEN" = true ] || {
            echo "::error::repo secret ANTHROPIC_API_KEY is not set: add it under Settings → Secrets and variables → Actions, then re-run this job"
            exit 1
          }

      # The diff half of the auto-merge rules. The review verdict and the
      # required checks are the other half; GitHub's auto-merge waits for them.
      - name: label the risk from the diff
        id: risk
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          verdict="$(bash scripts/ship/pr-risk.sh "$BASE" "$HEAD")"
          printf '%s\n' "$verdict"
          printf '%s\n' "$verdict" | grep -E '^(risk|lines)=' >>"$GITHUB_OUTPUT"
          {
            echo "### Auto-merge risk"
            printf '%s\n' "$verdict" | sed 's/^/    /'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: review the diff against the repo rules
        id: review
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          GH_TOKEN: ${{ github.token }}
          REVIEW_LOG: ${{ runner.temp }}/claude-review.log
        run: |
          set -euo pipefail
          log="$REVIEW_LOG"
          : >"$log"
          names="$(git diff --name-only "$BASE...$HEAD" || true)"
          if grep -qx '.github/workflows/claude-review.yml' <<<"$names"; then
            printf '%s\n' 'Exiting due to workflow validation skip' | tee "$log"
            exit 0
          fi
          if ! git cat-file -e "$BASE:scripts/claude-review.mjs"; then
            printf '%s\n' 'the reviewer script is not on the base commit' | tee "$log"
            exit 1
          fi
          git show "$BASE:scripts/claude-review.mjs" >"$RUNNER_TEMP/claude-review.mjs"
          node "$RUNNER_TEMP/claude-review.mjs" 2>&1 | tee -a "$log"

      - name: read the review verdict
        id: verdict
        if: steps.review.outcome == 'success'
        run: |
          set -euo pipefail
          f=claude-review-verdict.json
          if [ ! -f "$f" ]; then
            echo "present=0" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=1" >>"$GITHUB_OUTPUT"
          VERDICT="$(cat "$f")" node -e '
            const v = JSON.parse(process.env.VERDICT ?? "{}");
            const n = Number(v.blocking ?? 1);
            console.log("blocking=" + (Number.isInteger(n) && n >= 0 ? n : 1));
            console.log("summary=" + String(v.summary ?? "").replace(/\s+/g, " ").slice(0, 300));
          ' >>"$GITHUB_OUTPUT"

      # One sticky comment. explain exits 1, so a review that did not finish fails the check.
      - name: post the review status
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          SECRET_OUTCOME: ${{ steps.secret.outcome }}
          VERDICT_OUTCOME: ${{ steps.verdict.outcome }}
          PRESENT: ${{ steps.verdict.outputs.present }}
          BLOCKING: ${{ steps.verdict.outputs.blocking }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          REVIEW_LOG: ${{ runner.temp }}/claude-review.log
        run: |
          set -euo pipefail
          if [ "$REVIEW_OUTCOME" = success ] && [ "$VERDICT_OUTCOME" = success ] && [ "$PRESENT" = 1 ] && [ "$BLOCKING" = 0 ]; then
            bash scripts/ship/review-status.sh pass
            exit 0
          fi
          if [ "$REVIEW_OUTCOME" = success ] && [ "$VERDICT_OUTCOME" = success ] && [ "$PRESENT" = 1 ]; then
            bash scripts/ship/review-status.sh blocked
            exit 0
          fi
          names="$(git diff --name-only "$BASE...$HEAD" 2>/dev/null || true)"
          WORKFLOW_CHANGED=0
          if grep -qx '.github/workflows/claude-review.yml' <<<"$names"; then
            WORKFLOW_CHANGED=1
          fi
          export WORKFLOW_CHANGED
          if [ "$PRESENT" = 0 ]; then
            export VERDICT_PRESENT=0
          else
            export VERDICT_PRESENT=1
          fi
          bash scripts/ship/review-status.sh explain

      # The label only. Auto-merge itself is turned on by the Auto-merge
      # workflow, which runs after this one: this job's GITHUB_TOKEN is
      # read-only on a pull request opened by Dependabot, so the
      # enablePullRequestAutoMerge mutation is refused here (PR 13, run
      # 39659612854), while labelling works.
      - name: label the PR risk
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RISK_LEVEL: ${{ steps.risk.outputs.risk }}
          BLOCKING: ${{ steps.verdict.outputs.blocking }}
        run: |
          set -euo pipefail
          gh label create risk:low --color 0e8a16 --description "auto-merge may take it (CLAUDE.md)" --force
          gh label create risk:high --color b60205 --description "waits for Derek in GitHub (CLAUDE.md)" --force
          gh pr edit "$PR" --remove-label risk:low --remove-label risk:high || true
          gh pr edit "$PR" --add-label "risk:$RISK_LEVEL"
          if [ "$RISK_LEVEL" = low ] && [ "$BLOCKING" = 0 ]; then
            echo "risk:low — the Auto-merge workflow turns auto-merge on; GitHub merges it once check, smoke, signoff and claude-review are green." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "risk:$RISK_LEVEL — Derek approves and merges this one in GitHub." >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: the review must leave no blocking comment
        env:
          BLOCKING: ${{ steps.verdict.outputs.blocking }}
          SUMMARY: ${{ steps.verdict.outputs.summary }}
        run: |
          set -euo pipefail
          [ "$BLOCKING" = 0 ] || {
            echo "::error::the review left $BLOCKING blocking comment(s): $SUMMARY"
            echo "The review left $BLOCKING blocking comment(s): $SUMMARY" >>"$GITHUB_STEP_SUMMARY"
            exit 1
          }
          echo "The review left no blocking comment." >>"$GITHUB_STEP_SUMMARY"
