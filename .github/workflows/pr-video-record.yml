name: PR video record

# Job 1 of the explainer video, and the only one that runs the pull request's
# own code. It holds no secret at all: it builds the app, serves the production
# build on localhost, films the walkthrough at a phone size and a desktop size,
# and uploads the silent recording as a workflow artifact. The evidence job
# before it reads GitHub with a read-only token and hands over only text. Narrating, hosting
# and linking it is .github/workflows/pr-video-publish.yml, which never runs a
# line of this pull request. AGENTS.md "PR explainer videos".
#
# This costs money (the narration and the voice, in job 2), so it runs only
# after a Claude review has passed: the Golf Gus Bot app then adds the
# `review-passed` label, and that label going on is the one event that starts
# a recording. Review first, then the video (AGENTS.md "Paid jobs"). The
# decision itself is scripts/ship/paid-trigger.sh (PAID_FOR=video), so it is
# testable.
#
# It stays a `pull_request` run on purpose: it holds no secret, and its cache
# is the pull request's own. Recording from a workflow_run would run the pull
# request's code in main's context, where it could poison main's cache.
on:
  pull_request:
    types: [labeled]
    branches: [main]

# A newer pass (the review-passed label going on again) replaces the recording
# before it, and nothing else does. The
# trigger takes every `labeled` event, and the Claude review ends by setting a
# `risk:` label — so with one group per pull request that label's run joined the
# group and cancelled the recording in flight before its own decide job could
# say no, and a cancelled recording never reaches the publish workflow. Keying
# the group on the label keeps those apart.
concurrency:
  group: >-
    pr-video-record-${{ github.event.pull_request.number }}-${{
      github.event.action == 'labeled' && github.event.label.name || 'mark' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap, and separate, so the expensive job below can gate on a tested rule
  # rather than on an expression nobody can run.
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      paid: ${{ steps.trigger.outputs.paid }}
    steps:
      # The head's copy, deliberately. This workflow is `pull_request`, so the
      # file you are reading is the pull request's own: a branch that wanted to
      # record whenever it liked would edit this job out, not the script, and
      # reading the script from the base would only add a way for the job to
      # die on a pull request that introduces it. The cap that actually holds
      # is in scripts/ship/pr-video-publish.sh — main's copy, and the one that
      # spends: one video per passed review, whatever happens here.
      # (claude-review.yml is different: `pull_request_target` pins its workflow
      # file to main, so reading the script from the base is a real guard there.)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - id: trigger
        env:
          PAID_FOR: video
          PAID_EVENT: ${{ github.event_name }}
          PAID_ACTION: ${{ github.event.action }}
          PAID_LABEL: ${{ github.event.label.name }}
          PAID_DRAFT: ${{ github.event.pull_request.draft }}
          PAID_AUTHOR: ${{ github.event.pull_request.user.login }}
          PAID_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PAID_REPO: ${{ github.repository }}
        run: bash scripts/ship/paid-trigger.sh

  # The evidence half of the video: the commands a checked-in walkthrough names on
  # `// walkthrough-evidence:` lines, run for real against GitHub and kept as text
  # for the record job to play back (scripts/ship/pr-video-evidence.sh). On the
  # runner, which has gh and jq, with a token that reads and writes nothing: the
  # commands are an allowlist run as gh arguments, never through a shell. The
  # record job below never sees this token, only what the commands printed.
  evidence:
    needs: decide
    if: needs.decide.outputs.paid == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: capture the evidence
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ship/pr-video-evidence.sh pr-video-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-video-evidence
          path: pr-video-evidence
          retention-days: 1

  record:
    needs: [decide, evidence]
    # A failed evidence job costs the clips, never the video: the walkthrough
    # says so on screen and films the rest.
    if: ${{ !cancelled() && needs.decide.outputs.paid == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # The same pinned image the smoke jobs use, so no step here installs a
    # browser either. The walkthrough films both sizes in the image's Chromium.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    # A container's default shell is `sh`, which has no `pipefail`.
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # The container runs as root, where Chromium cannot start its sandbox.
      CHROME_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Served with the build, so the walkthrough reads it at /__evidence/.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: pr-video-evidence
          path: dist/__evidence
      - name: film the walkthrough
        timeout-minutes: 10
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ship/pr-video-record.sh pr-video
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-video-raw
          path: pr-video
          retention-days: 1
