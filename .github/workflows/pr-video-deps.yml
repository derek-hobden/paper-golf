name: PR video for dependency updates

# The explainer video for a dependency update: a pull request Dependabot or
# Renovate opened (lib.sh SHIP_DEPENDENCY_BOTS). Those buy no Claude review and
# write no `## How to see it` steps, so the review path (pr-video-record.yml and
# pr-video-publish.yml, after a review passes) never makes their video, and the
# pr-video check fails closed without one (Derek, 31 Oct 2026). This makes it.
#
# Every line that runs here is main's copy. It is a workflow_run of CI, so
# GitHub runs this file from the default branch; every checkout below is the
# default branch, with no credential kept; and the pull request is read only
# through the API, as data (scripts/ship/pr-video-deps.sh): its diff, its CI
# run's jobs, main's own CI run. Nothing from the pull request's head is checked
# out, built or run, and nothing it wrote reaches a shell.
#
#   decide  (read-only token) a green CI run of a dependency bot's pull request
#           at its head, with no video on top that stands for it? Then the facts.
#   record  (no secret, no token) main's walkthrough films the facts in the
#           Playwright image (e2e/walkthroughs/deps/), one 16:9 clip with its
#           scene starts and the narration's story.
#   make    (the two keys, a read-only token) proves it again against the API
#           and narrates and muxes it: pr-video-publish.sh, VIDEO_KIND=dependency.
#   gate    (no secret at all) listens to it: pr-video-audio-gate.sh.
#   upload  (the app token, only when the gate passed) hosts it on the month's
#           shelf and writes the link as the first line of the body, which turns
#           the pr-video check green.
# Those last three are the review path's own jobs, step for step: one maker.
# A Dependabot run gets Dependabot's secrets and a read-only GITHUB_TOKEN, so
# ANTHROPIC_API_KEY, OPENROUTER_API_KEY, GOLF_GUS_APP_ID and GOLF_GUS_APP_KEY
# have to be in the Dependabot store as well as the Actions store
# (docs/pipeline-rollout.md). Every action is pinned to a full commit sha.
#
# The run's name says which pull request and head it makes the video for: a
# workflow_run's own head is main's, so the pr-video check finds this run by
# that name (lib.sh ship_video_deps_name) while it waits for the link.
run-name: >-
  PR video for dependency update ${{ github.event.workflow_run.pull_requests[0].number }} at ${{
  github.event.workflow_run.head_sha }}
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# One video at a time per branch; a newer CI run waits rather than cancel one
# that is already buying.
concurrency:
  group: pr-video-deps-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  decide:
    # Only a green pull_request run of this repository; every other CI run
    # (main's pushes, a fork, a red run) stops here with nothing read.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      make: ${{ steps.decide.outputs.make }}
    steps:
      # The default branch's copy of the scripts. Never the pull request's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: does this run earn a dependency video
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          SHIP_REPO: ${{ github.repository }}
          # From the event, which GitHub writes: never from the pull request.
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: bash scripts/ship/pr-video-deps.sh decide pr-video-facts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.decide.outputs.make == 'yes'
        with:
          name: pr-video-facts
          path: pr-video-facts
          retention-days: 1

  record:
    needs: decide
    if: needs.decide.outputs.make == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # The same pinned image the smoke jobs use, so no step here installs a
    # browser. The film is main's code drawing the facts: no server, no build.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    # A container's default shell is `sh`, which has no `pipefail`.
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # The container runs as root, where Chromium cannot start its sandbox.
      CHROME_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-video-facts
          path: pr-video
      - name: film the dependency update
        timeout-minutes: 5
        run: bash scripts/ship/pr-video-deps.sh film pr-video
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-video-raw
          path: pr-video
          retention-days: 1

  make:
    needs: record
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reads only: the pull request, its comments, the CI run and the recording.
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    outputs:
      made: ${{ steps.make.outputs.made }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: the explainer needs both keys and the Golf Gus Bot app
        env:
          HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OPENROUTER: ${{ secrets.OPENROUTER_API_KEY != '' }}
          HAS_APP: ${{ secrets.GOLF_GUS_APP_ID != '' && secrets.GOLF_GUS_APP_KEY != '' }}
        run: |
          set -euo pipefail
          missing=''
          [ "$HAS_ANTHROPIC" = true ] || missing="$missing ANTHROPIC_API_KEY"
          [ "$HAS_OPENROUTER" = true ] || missing="$missing OPENROUTER_API_KEY"
          [ "$HAS_APP" = true ] || missing="$missing GOLF_GUS_APP_ID+GOLF_GUS_APP_KEY"
          [ -z "$missing" ] || {
            echo "::error::the dependency update's video needs these secrets, in the Actions store and, for a Dependabot run, the Dependabot store:$missing"
            exit 1
          }
      - name: the recording from main's film
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-video-raw
          path: pr-video
      # A static build at a pinned release and SHA-256, never a package
      # install, as in pr-video-publish.yml.
      - name: the ffmpeg cache key
        id: ffmpeg-key
        run: echo "key=$(bash scripts/ship/install-ffmpeg.sh --key)" >>"$GITHUB_OUTPUT"
      - name: the cached ffmpeg build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pr-video-ffmpeg
          key: ${{ steps.ffmpeg-key.outputs.key }}
      - name: ffmpeg
        timeout-minutes: 5
        run: bash scripts/ship/install-ffmpeg.sh
      - name: narrate it and mux it
        id: make
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          SHIP_REPO: ${{ github.repository }}
          # The dependency path: proved by its green CI run, its result said last.
          VIDEO_KIND: dependency
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: bash scripts/ship/pr-video-publish.sh pr-video
      - name: keep the made video
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-video-made
          retention-days: 14
          if-no-files-found: ignore
          path: |
            pr-video/work/video.mp4
            pr-video/work/narration.txt
            pr-video/work/narration.wav
            pr-video/work/model.log
            pr-video/work/made.json

  # No secret in reach: no key, no app, no token beyond Contents read.
  gate:
    needs: make
    if: needs.make.outputs.made == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: the made video
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-video-made
          path: made
      - name: the ffmpeg cache key
        id: ffmpeg-key
        run: echo "key=$(bash scripts/ship/install-ffmpeg.sh --key)" >>"$GITHUB_OUTPUT"
      - name: the cached ffmpeg build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pr-video-ffmpeg
          key: ${{ steps.ffmpeg-key.outputs.key }}
      - name: ffmpeg
        timeout-minutes: 5
        run: bash scripts/ship/install-ffmpeg.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: the cached speech-to-text model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/huggingface
          key: pr-video-whisper-${{ hashFiles('scripts/ship/pr-video-audio-gate.sh', 'scripts/ship/audio-gate-requirements.txt') }}
      - name: faster-whisper
        timeout-minutes: 5
        run: >-
          python -m pip install --disable-pip-version-check -q
          --require-hashes --no-deps --only-binary=:all: -r scripts/ship/audio-gate-requirements.txt
      - name: listen to it
        timeout-minutes: 8
        run: |
          set -euo pipefail
          # A test transcript never stands in for Whisper here.
          unset AUDIO_GATE_TRANSCRIPT
          bash scripts/ship/pr-video-audio-gate.sh made/video.mp4 made/narration.txt \
            made/narration.wav made/audio-gate.txt
      - name: keep the debug files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-video-debug
          retention-days: 14
          if-no-files-found: ignore
          path: |
            made/narration.txt
            made/narration.wav
            made/narration.wav.beats
            made/audio-gate.txt
            made/transcript.txt
            made/model.log

  upload:
    needs: [make, gate]
    if: needs.make.outputs.made == 'true' && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The app's token writes the asset and the body; this job's own token only
    # re-runs the pr-video check's failed run (a Dependabot run's is read-only,
    # so that re-run is refused with a warning, and the body edit re-runs it).
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: the made video
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-video-made
          path: made
      - name: the gate's report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-video-debug
          path: made
      # v2, as pr-video-publish.yml: v3 deprecates app-id for client-id.
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: gus
        with:
          app-id: ${{ secrets.GOLF_GUS_APP_ID }}
          private-key: ${{ secrets.GOLF_GUS_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: host it, and put the link at the top
        id: publish
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ steps.gus.outputs.token }}
          SHIP_REPO: ${{ github.repository }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash scripts/ship/pr-video-publish.sh --upload made
      - name: re-run the pr-video check's failed run for this head
        if: always() && steps.publish.outcome == 'success'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          SHIP_REPO: ${{ github.repository }}
          WORKFLOW: pr-video.yml
          EVENT: pull_request
        run: |
          set -euo pipefail
          PR="$(jq -r '.pr // empty' made/made.json)" bash scripts/ship/rerun-failed.sh
