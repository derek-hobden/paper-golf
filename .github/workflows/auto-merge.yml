name: Auto-merge

# Every open pull request is set to auto-merge (squash, delete the head branch)
# when it opens, and again when the body changes, so the explainer link landing
# at the top of the body turns it on. GitHub merges once check, smoke,
# claude-review and pr-video are green. Risk labels do not gate the merge.
#
# pull_request_target runs this file from the default branch, so a pull request
# cannot delete the step. The token can enable auto-merge: a pull_request run
# on a Dependabot branch is read-only and the mutation is refused there
# (PR 13, run 39659612854). The workflow_run of "PR video" retries with the
# repository's own token after that check passes.
#
# Nothing from the pull request's head is checked out or run. The script reads
# the pull request through gh api. CLAUDE.md "Ship process".
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, edited]
    branches: [main]
  workflow_run:
    workflows: ["PR video"]
    types: [completed]

concurrency:
  group: paper-golf-auto-merge-${{ github.event.pull_request.number || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  auto-merge:
    if: >-
      (github.event_name == 'pull_request_target' &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The base, or this workflow's own commit on main. Never the head.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 1
      - name: turn auto-merge on
        env:
          GH_TOKEN: ${{ github.token }}
          SHIP_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -uo pipefail
          status=0
          bash scripts/ship/auto-merge.sh >"$RUNNER_TEMP/auto-merge.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/auto-merge.txt"
          {
            echo "### Auto-merge"
            sed 's/^/    /' "$RUNNER_TEMP/auto-merge.txt"
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"
