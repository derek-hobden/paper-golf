name: Auto-merge

# GitHub's auto-merge for a risk:low pull request whose Claude review passed.
# The review job cannot turn it on itself: a pull request opened by Dependabot
# runs with a read-only GITHUB_TOKEN, so enablePullRequestAutoMerge answered
# "Resource not accessible by integration" there (PR 13, run 39659612854) and
# the log blamed the repository's auto-merge setting instead. This workflow runs
# after the review instead, on workflow_run, so it gets the repository's own
# token, with contents: write and pull-requests: write.
#
# It never checks out or runs anything from the pull request's head: the
# checkout is this workflow's own commit on main (workflow_run runs the default
# branch's copy) and the pull request is read through gh api only.
# risk:high and unlabelled pull requests wait for Derek, exactly as before.
# Nothing here merges, reviews or deploys: GitHub merges the pull request once
# check, smoke, signoff and claude-review are green. CLAUDE.md "Ship process".
on:
  workflow_run:
    workflows: ["Claude review"]
    types: [completed]

concurrency:
  group: paper-golf-auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  auto-merge:
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: turn auto-merge on for a risk:low pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SHIP_REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REVIEW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -uo pipefail
          # The decision, and a refusal with what it means, belong in the log and
          # the summary either way: a refused mutation is this job's only failure.
          status=0
          bash scripts/ship/auto-merge.sh >"$RUNNER_TEMP/auto-merge.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/auto-merge.txt"
          {
            echo "### Auto-merge"
            sed 's/^/    /' "$RUNNER_TEMP/auto-merge.txt"
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"
