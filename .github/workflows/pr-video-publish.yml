name: PR video publish

# Job 2 of the explainer video: the half that holds the secrets. It is a
# separate workflow on workflow_run so that GitHub runs this file from the
# default branch and never the pull request's copy, and it never checks out or
# runs a line of the pull request. All it takes from job 1 is a silent
# recording and the number of the pull request it claims to be — and the claim
# is checked against the API before anything is spent (AGENTS.md "PR explainer
# videos").
#
# Three jobs after the check that anything was filmed, each holding only what
# it needs:
#   make    writes the narration with Claude, voices it with OpenRouter and
#           muxes the mp4. The two keys, and a read-only GITHUB_TOKEN.
#   gate    listens to it (pr-video-audio-gate.sh: speech against the raw
#           narration, silence, loudness and speech-to-text against the
#           script). No secret at all and Contents read; faster-whisper from a
#           hash-pinned requirements file, the model at a pinned revision.
#   upload  only when the gate passed: hosts the mp4 as an asset on the
#           long-lived `pr-videos` prerelease — a documented endpoint, free,
#           and it outlives the merge — and puts that link as the first line
#           of the pull request body, as Golf Gus Bot. The only job with the
#           app token.
# That body edit is an App write, so it raises a pull_request `edited` event
# and the pr-video check re-runs and goes green on its own. Every action is
# pinned to a full commit sha, its tag in a comment.
on:
  workflow_run:
    workflows: ["PR video record"]
    types: [completed]

concurrency:
  group: pr-video-publish-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  # A record run whose `record` job was skipped — a draft, or a label that is
  # not a ready mark — still concludes `success`, because a run of nothing but
  # skipped jobs does. Without this job the publish below would start for every
  # one of those and go red on a missing artifact: no money spent and nothing
  # gated, but a red run on the pull request for no reason.
  recorded:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      found: ${{ steps.artifact.outputs.found }}
    steps:
      - name: did that run film anything
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          found="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
            --jq '[.artifacts[] | select(.name == "pr-video-raw" and (.expired | not))] | length')"
          echo "found=$found" >>"$GITHUB_OUTPUT"
          if [ "$found" = 0 ]; then
            echo "that run recorded nothing; there is nothing to publish"
          fi

  make:
    needs: recorded
    # Only a green recording of a pull request of this repository, and only one
    # that left a recording. A fork's run never reaches the secrets below.
    if: needs.recorded.outputs.found != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reads only: the pull request, its timeline and comments, and the
    # recording. It handles an artifact that the pull request's own code
    # produced, so its GITHUB_TOKEN can write nothing.
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    outputs:
      made: ${{ steps.make.outputs.made }}
    steps:
      # The default branch's copy of the scripts. Never the pull request's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: the explainer needs both keys and the Golf Gus Bot app
        env:
          HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OPENROUTER: ${{ secrets.OPENROUTER_API_KEY != '' }}
          HAS_APP: ${{ secrets.GOLF_GUS_APP_ID != '' && secrets.GOLF_GUS_APP_KEY != '' }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/settings/secrets/actions
        run: |
          set -euo pipefail
          missing=''
          [ "$HAS_ANTHROPIC" = true ] || missing="$missing ANTHROPIC_API_KEY"
          [ "$HAS_OPENROUTER" = true ] || missing="$missing OPENROUTER_API_KEY"
          [ "$HAS_APP" = true ] || missing="$missing GOLF_GUS_APP_ID+GOLF_GUS_APP_KEY"
          [ -z "$missing" ] || {
            echo "::error::the explainer video needs these repository secrets:$missing ($run_url)"
            exit 1
          }
      - name: the recording from the job that ran the pull request
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-video-raw
          path: pr-video
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: ffmpeg
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: narrate it and mux it
        id: make
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          SHIP_REPO: ${{ github.repository }}
          # From the event, not from the artifact: the artifact was written by
          # a job that ran the pull request's own code.
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: bash scripts/ship/pr-video-publish.sh pr-video
      # The finished video for the gate and the upload, and — pass or fail —
      # what the voice was given, what it said and how the model answered.
      # A workflow artifact for 14 days; never committed.
      - name: keep the made video
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-video-made
          retention-days: 14
          if-no-files-found: ignore
          path: |
            pr-video/work/video.mp4
            pr-video/work/narration.txt
            pr-video/work/narration.wav
            pr-video/work/model.log
            pr-video/work/made.json

  # The listener runs on pull-request data with no secret in reach: no key, no
  # app, no token beyond Contents read. Its report goes to the step summary and
  # to the debug artifact, and the upload below runs only if it passed.
  gate:
    needs: make
    if: needs.make.outputs.made == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: the made video
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-video-made
          path: made
      - name: ffmpeg
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      # The model at the revision pr-video-audio-gate.sh pins, cached between
      # runs; the key names the revision, so a new pin downloads afresh.
      - name: the cached speech-to-text model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/huggingface
          key: pr-video-whisper-${{ hashFiles('scripts/ship/pr-video-audio-gate.sh', 'scripts/ship/audio-gate-requirements.txt') }}
      # Every package, the dependencies included, at an exact version and hash.
      - name: faster-whisper
        timeout-minutes: 5
        run: >-
          python -m pip install --disable-pip-version-check -q
          --require-hashes --no-deps -r scripts/ship/audio-gate-requirements.txt
      - name: listen to it
        timeout-minutes: 8
        run: |
          set -euo pipefail
          # A test transcript never stands in for Whisper here.
          unset AUDIO_GATE_TRANSCRIPT
          bash scripts/ship/pr-video-audio-gate.sh made/video.mp4 made/narration.txt \
            made/narration.wav made/audio-gate.txt
      # What the voice was given, what it said, what the gate heard and how the
      # model answered, from every run that got this far, pass or fail. A
      # workflow artifact for 14 days; never committed.
      - name: keep the debug files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-video-debug
          retention-days: 14
          if-no-files-found: ignore
          path: |
            made/narration.txt
            made/narration.wav
            made/audio-gate.txt
            made/transcript.txt
            made/model.log

  upload:
    needs: [make, gate]
    # Only a video the gate passed. pr-video-publish.sh --upload checks the
    # gate's report again before it hosts anything.
    if: needs.make.outputs.made == 'true' && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The release the video hangs on takes Contents write — but the token that
    # creates it is the app's, whose Contents: read and write is on the
    # installation (docs/pipeline-rollout.md). This job's own GITHUB_TOKEN never
    # calls the releases API, so it is given no write at all.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: the made video
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-video-made
          path: made
      - name: the gate's report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-video-debug
          path: made
      # v2, not v3: v3 deprecates app-id for client-id, and GOLF_GUS_APP_ID is
      # the app id (the same reason .github/workflows/auto-merge.yml pins v2).
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: gus
        with:
          app-id: ${{ secrets.GOLF_GUS_APP_ID }}
          private-key: ${{ secrets.GOLF_GUS_APP_KEY }}
      - name: host it, and put the link at the top
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ steps.gus.outputs.token }}
          SHIP_REPO: ${{ github.repository }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash scripts/ship/pr-video-publish.sh --upload made
