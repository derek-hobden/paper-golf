name: PR video publish

# Job 2 of the explainer video: the half that holds the secrets. It is a
# separate workflow on workflow_run so that GitHub runs this file from the
# default branch and never the pull request's copy, and it never checks out or
# runs a line of the pull request. All it takes from job 1 is a silent
# recording and the number of the pull request it claims to be — and the claim
# is checked against the API before anything is spent (AGENTS.md "PR explainer
# videos").
#
# Three jobs after the check that anything was filmed, each holding only what
# it needs:
#   make    writes the narration with Claude, voices it with OpenRouter and
#           muxes the mp4. The two keys, and a read-only GITHUB_TOKEN.
#   gate    listens to it (pr-video-audio-gate.sh: speech against the raw
#           narration, silence, loudness and speech-to-text against the
#           script), and only advises: what it hears is a warning, never a
#           failure. No secret at all and Contents read; faster-whisper from a
#           hash-pinned requirements file, the model at a pinned revision.
# Both of those take ffmpeg from install-ffmpeg.sh: a static build at a pinned
# release and SHA-256, never a package install.
#   upload  whatever the gate said, or whether it ran: hosts the mp4 as an asset on the
#           month's PR video shelf, a `pr-videos-YYYY-MM` prerelease — a
#           documented endpoint, free, and it outlives the merge (the tidy-up,
#           pr-video-tidy.yml, keeps the linked one for good) — and puts that link as the first line
#           of the pull request body, as Golf Gus Bot. The only job with the
#           app token.
# The explainer video is best effort and never holds a merge (Derek, 1 Nov
# 2026): a video problem is a warning in the step summary, and the pr-video
# check passes once the review has, video or none. Every action is pinned to a
# full commit sha, its tag in a comment.
# The run's name says which pull request and head it films, because a
# workflow_run's own head is main's (run 40490493197 reports headBranch main):
# the pr-video check finds a publish in flight for its head by this name
# (lib.sh ship_video_publish_name), never by branch.
run-name: >-
  PR video publish for pull request ${{ github.event.workflow_run.pull_requests[0].number }} at ${{
  github.event.workflow_run.head_sha }}
on:
  workflow_run:
    workflows: ["PR video record"]
    types: [completed]

concurrency:
  group: pr-video-publish-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  # A record run whose `record` job was skipped — a draft, or a label that is
  # not a ready mark — still concludes `success`, because a run of nothing but
  # skipped jobs does. Without this job the publish below would start for every
  # one of those and go red on a missing artifact: no money spent and nothing
  # gated, but a red run on the pull request for no reason.
  recorded:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      found: ${{ steps.artifact.outputs.found }}
    steps:
      - name: did that run film anything
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          found="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
            --jq '[.artifacts[] | select(.name == "pr-video-raw" and (.expired | not))] | length')"
          echo "found=$found" >>"$GITHUB_OUTPUT"
          if [ "$found" = 0 ]; then
            echo "that run recorded nothing; there is nothing to publish"
          fi

  make:
    needs: recorded
    # Only a green recording of a pull request of this repository, and only one
    # that left a recording. A fork's run never reaches the secrets below.
    if: needs.recorded.outputs.found != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reads only: the pull request, its timeline and comments, and the
    # recording. It handles an artifact that the pull request's own code
    # produced, so its GITHUB_TOKEN can write nothing.
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    outputs:
      made: ${{ steps.make.outputs.made }}
    steps:
      # The default branch's copy of the scripts. Never the pull request's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # No git command here talks to GitHub, so no credential is left in
          # .git/config for a later step to read.
          persist-credentials: false
      - name: the explainer needs both keys and the Golf Gus Bot app
        env:
          HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OPENROUTER: ${{ secrets.OPENROUTER_API_KEY != '' }}
          HAS_APP: ${{ secrets.GOLF_GUS_APP_ID != '' && secrets.GOLF_GUS_APP_KEY != '' }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/settings/secrets/actions
        run: |
          set -euo pipefail
          missing=''
          [ "$HAS_ANTHROPIC" = true ] || missing="$missing ANTHROPIC_API_KEY"
          [ "$HAS_OPENROUTER" = true ] || missing="$missing OPENROUTER_API_KEY"
          [ "$HAS_APP" = true ] || missing="$missing GOLF_GUS_APP_ID+GOLF_GUS_APP_KEY"
          [ -z "$missing" ] || {
            echo "::error::the explainer video needs these repository secrets:$missing ($run_url)"
            exit 1
          }
      - name: the recording from the job that ran the pull request
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-video-raw
          path: pr-video
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      # A static build at a pinned release and SHA-256, never a package
      # install: apt hung to the step limit in run 40350234858. The archives
      # are cached on their checksums and checked again either way.
      - name: the ffmpeg cache key
        id: ffmpeg-key
        run: echo "key=$(bash scripts/ship/install-ffmpeg.sh --key)" >>"$GITHUB_OUTPUT"
      - name: the cached ffmpeg build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pr-video-ffmpeg
          key: ${{ steps.ffmpeg-key.outputs.key }}
      - name: ffmpeg
        timeout-minutes: 5
        run: bash scripts/ship/install-ffmpeg.sh
      - name: narrate it and mux it
        id: make
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          SHIP_REPO: ${{ github.repository }}
          # From the event, not from the artifact: the artifact was written by
          # a job that ran the pull request's own code.
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: bash scripts/ship/pr-video-publish.sh pr-video
      # The finished video for the gate and the upload, and — pass or fail —
      # what the voice was given, what it said and how the model answered.
      # A workflow artifact for 14 days; never committed.
      - name: keep the made video
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-video-made
          retention-days: 14
          if-no-files-found: ignore
          path: |
            pr-video/work/video.mp4
            pr-video/work/narration.txt
            pr-video/work/narration.wav
            pr-video/work/model.log
            pr-video/work/made.json

  # The listener runs on pull-request data with no secret in reach: no key, no
  # app, no token beyond Contents read. Its report goes to the step summary and
  # to the debug artifact. It only advises (--advisory): a video it fails is a
  # warning, and the upload below runs whatever it said.
  gate:
    needs: make
    if: needs.make.outputs.made == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # No git command here talks to GitHub, so no credential is left in
          # .git/config for a later step to read.
          persist-credentials: false
      - name: the made video
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-video-made
          path: made
      # A static build at a pinned release and SHA-256, never a package
      # install: apt hung to the step limit in run 40350234858. The archives
      # are cached on their checksums and checked again either way.
      - name: the ffmpeg cache key
        id: ffmpeg-key
        run: echo "key=$(bash scripts/ship/install-ffmpeg.sh --key)" >>"$GITHUB_OUTPUT"
      - name: the cached ffmpeg build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pr-video-ffmpeg
          key: ${{ steps.ffmpeg-key.outputs.key }}
      - name: ffmpeg
        timeout-minutes: 5
        run: bash scripts/ship/install-ffmpeg.sh
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # The model at the revision pr-video-audio-gate.sh pins, cached between
      # runs; the key names the revision, so a new pin downloads afresh.
      - name: the cached speech-to-text model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: pr-video-whisper-${{ hashFiles('scripts/ship/pr-video-audio-gate.sh', 'scripts/ship/audio-gate-requirements.txt') }}
      # Every package, the dependencies included, at an exact version and hash,
      # from wheels only, so no package runs a build script.
      - name: faster-whisper
        timeout-minutes: 5
        run: >-
          python -m pip install --disable-pip-version-check -q
          --require-hashes --no-deps --only-binary=:all: -r scripts/ship/audio-gate-requirements.txt
      - name: listen to it (best effort, a warning at most)
        timeout-minutes: 8
        run: |
          set -euo pipefail
          # A test transcript never stands in for Whisper here.
          unset AUDIO_GATE_TRANSCRIPT
          bash scripts/ship/pr-video-audio-gate.sh --advisory made/video.mp4 made/narration.txt \
            made/narration.wav made/audio-gate.txt
      # What the voice was given, what it said, what the gate heard and how the
      # model answered, from every run that got this far, pass or fail. A
      # workflow artifact for 14 days; never committed.
      - name: keep the debug files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-video-debug
          retention-days: 14
          if-no-files-found: ignore
          path: |
            made/narration.txt
            made/narration.wav
            made/narration.wav.beats
            made/audio-gate.txt
            made/transcript.txt
            made/model.log

  upload:
    needs: [make, gate]
    # Every video make made, whatever the gate said, and even when the gate job
    # itself broke: the video is best effort and never held back by a quality
    # check. pr-video-publish.sh --upload warns about what the gate heard.
    if: ${{ !cancelled() && needs.make.outputs.made == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The release the video hangs on takes Contents write — but the token that
    # creates it is the app's, whose Contents: read and write is on the
    # installation (docs/pipeline-rollout.md). This job's own GITHUB_TOKEN never
    # calls the releases API; its one write is Actions write, to re-run the
    # pr-video check's failed run once the link is up (the app has no Actions
    # permission).
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # No git command here talks to GitHub, and this job's token can write
          # (actions: write, to re-run the pr-video check), so no credential is left
          # in .git/config for a later step to read.
          persist-credentials: false
      - name: the made video
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-video-made
          path: made
      # A gate job that broke before it kept its report leaves none: the upload
      # says the audio was never checked and hosts the video anyway.
      - name: the gate's report
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-video-debug
          path: made
      # v2, not v3: v3 deprecates app-id for client-id, and GOLF_GUS_APP_ID is
      # the app id (the same reason .github/workflows/auto-merge.yml pins v2).
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: gus
        with:
          app-id: ${{ secrets.GOLF_GUS_APP_ID }}
          private-key: ${{ secrets.GOLF_GUS_APP_KEY }}
          # This repository only, and only what the upload writes: the release
          # asset (Contents), the body's first line (Pull requests) and the
          # comment that records the ready mark the video was bought for, which
          # the one-video cap reads (Issues).
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: host it, and put the link at the top
        id: publish
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ steps.gus.outputs.token }}
          SHIP_REPO: ${{ github.repository }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash scripts/ship/pr-video-publish.sh --upload made
      # The body edit above starts a new pr-video run, but the red one from the
      # ready mark would stay in the head's rollup beside it, so its own failed
      # or cancelled run is re-run. A refusal is a warning, never a red job.
      - name: re-run the pr-video check's failed run for this head
        if: always() && steps.publish.outcome == 'success'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          SHIP_REPO: ${{ github.repository }}
          WORKFLOW: pr-video.yml
          EVENT: pull_request
        run: |
          set -euo pipefail
          PR="$(jq -r '.pr // empty' made/made.json)" bash scripts/ship/rerun-failed.sh
