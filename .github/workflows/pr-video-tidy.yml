name: PR video tidy

# When a pull request to main merges or closes, take its superseded explainer
# videos off the PR video shelves and keep the one its body links to, for good
# (AGENTS.md "PR explainer videos"). The decision is scripts/ship/pr-video-tidy.sh;
# this workflow only calls it with the closing event's body and final head sha.
# Merged and closed-unmerged are treated the same, and in doubt it deletes nothing.
#
# pull_request_target runs this file from the default branch, and the checkout
# below is the default branch too, so the script that runs is main's: nothing
# from the head is checked out or run, and a pull request can rewrite neither
# this workflow nor the tidy-up. (The same reasoning as
# .github/workflows/owner-approval.yml.) The workflow's own token reads only;
# the Golf Gus Bot app's token, in the tidy step alone, is the only writer, and
# its one write is DELETE releases/assets/<id>.
#
# It spends nothing: a handful of API calls, no model and no voice.
on:
  pull_request_target:
    types: [closed]
    branches: [main]

# One run per pull request, never cancelled part way through its deletes.
concurrency:
  group: pr-video-tidy-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The default branch. Never the head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: the Golf Gus Bot app is how this job deletes
        env:
          APP_ID: ${{ secrets.GOLF_GUS_APP_ID }}
          APP_KEY: ${{ secrets.GOLF_GUS_APP_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "This job cannot tidy the PR video shelves without the Golf Gus Bot app." >&2
            echo "Add GOLF_GUS_APP_ID (the app id) and GOLF_GUS_APP_KEY (the app's PEM" >&2
            echo "private key) to this repository's Actions secrets, and to its Dependabot" >&2
            echo "secrets for Dependabot pull requests. Nothing was deleted." >&2
            exit 1
          fi
      # v2, not v3: v3 deprecates app-id for client-id, and GOLF_GUS_APP_ID is
      # the app id (the same reason .github/workflows/auto-merge.yml pins v2).
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: gus
        with:
          app-id: ${{ secrets.GOLF_GUS_APP_ID }}
          private-key: ${{ secrets.GOLF_GUS_APP_KEY }}
      - name: delete this pull request's superseded videos, keep the linked one
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ steps.gus.outputs.token }}
          SHIP_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          # The body as it closed: its first line is the video to keep.
          PR_BODY: ${{ github.event.pull_request.body }}
          # The final head, whose video is kept too, so a publish still in
          # flight at close cannot lose its file. Only handed to the script.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ship/pr-video-tidy.sh
