name: PR video

# The PR explainer-video rule (AGENTS.md "PR explainer videos"): a pull request's
# explainer video is never committed to it — CI records it, narrates it and hosts it
# as an asset on one of this repository's PR video shelves (prereleases), then writes
# its link as the very first line of the body. The decision is scripts/ship/pr-video.sh;
# this workflow only calls it, on every edit of the body as well as every push.
# The video is best effort and never holds a merge (Derek, 1 Nov 2026): once the
# Claude review has passed this check passes, video or none, and what is wrong with
# the video is a note in the step summary. It fails only for a video committed to the
# pull request, and, on a ready pull request, until the review passes. It waits for no
# video; the review re-runs this workflow's failed run for the head when it passes.
# A draft passes: the video is made when the pull request is marked ready, so there
# is nothing to check before then.
# The token is read-only (contents, and the pull request it reads live) and the job
# holds no repo secret, so nothing here can write, deploy, or hand a secret to the
# pull request's own code. A product video elsewhere in the repo is fine.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [main]

# A re-run attempt (rerun-failed.sh, once the video is published) gets a group
# of its own: it reuses its old event, so in the shared group it would cancel
# the fresh `edited` run the publish's body edit started, or be cancelled by it.
concurrency:
  group: >-
    pr-video-${{ github.event.pull_request.number }}${{
      github.run_attempt != '1' && format('-attempt-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-video:
    runs-on: ubuntu-latest
    # It waits for nothing: a few seconds of git and one API read.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      # The video is tied to the head: the walk from the video's commit to the
      # head, and whether a merge on it brought in main and nothing else, need
      # the whole history and the base branch's tip. Missing history fails the
      # check closed.
      - name: the base branch tip
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
      - name: the explainer video is CI's, linked at the top of the body
        env:
          PR_ACTOR: ${{ github.event.pull_request.user.login }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_BODY: ${{ github.event.pull_request.body }}
          # No review-passed label yet means no video yet (review first); with it
          # the check passes, video or none.
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          # The link has to be to one of this repository's own video shelves.
          SHIP_REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
          # Read only: the body, the draft state and the labels, read live (a
          # re-run reuses its old event).
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_TIP: origin/${{ github.event.pull_request.base.ref }}
          # A ready pull request needs a ## How to see it step: until its review
          # passes it fails at once without one, with an example; a draft is warned.
          PR_VIDEO_NEEDS_STEPS: '1'
        run: bash scripts/ship/pr-video.sh "$BASE" HEAD
