name: CI

# Every PR to main: check + smoke, under those names, so they can be required status checks
# (Claude's review is the third one, .github/workflows/claude-review.yml).
# Push to main: check + smoke, then the staging deploy of that sha, smoked on the staging host.
# There are no preview deploys of a branch or a PR: staging and production are the only deploys.
# A staging smoke that passes promotes that same sha to production, which is smoked again with the
# quick suite (`npm run smoke:quick`, the `@quick` tests in Chrome) and rolled back to the last good
# deployment when that smoke fails (the run then fails, and Gary pings Derek).
# Emergency path, when the merge pipeline cannot do it: workflow_dispatch on main with
#   sha=<full sha on main> and confirm=deploy-production, which runs check + smoke on that sha first.
# Vercel builds only from here (Vercel CLI with the
# VERCEL_TOKEN repo secret, read from env, never in argv): no Vercel GitHub app or Git integration.
# Paper Golf uses no tags. CLAUDE.md "Ship process".
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-hex commit on main to deploy to production (Derek's recorded yes)
        required: true
        type: string
      confirm:
        description: Type deploy-production
        required: true
        type: string

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # A new push to a PR replaces its run; a run on main (which deploys) is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Not secrets: the Vercel team and project Derek approved (14 Oct 2026).
  VERCEL_ORG_ID: team_NOIeemLqazmSprS9Y1tgjYx1
  VERCEL_PROJECT_ID: prj_2wXuwwaoThxXs8GAfBfcreeFeWO0
  VERCEL_SCOPE: derek-hobden
  VERCEL_CLI: vercel@61.1.0

jobs:
  # The commit this run checks and deploys: the pushed sha, the PR's merge commit (what CI must
  # prove before the merge), or the dispatch input after its guards.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: sha
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.sha }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          # push: the pushed commit; pull_request: the merge commit GitHub made for the PR.
          if [ "$EVENT" != workflow_dispatch ]; then
            echo "sha=$GITHUB_SHA" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::run the production deploy from main"; exit 1; }
          [ "$CONFIRM" = deploy-production ] || { echo "::error::confirm must be deploy-production"; exit 1; }
          [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-hex commit"; exit 1; }
          git merge-base --is-ancestor "$INPUT_SHA" origin/main || { echo "::error::$INPUT_SHA is not on main"; exit 1; }
          echo "sha=$INPUT_SHA" >>"$GITHUB_OUTPUT"

  check:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # typecheck (TS 7) + ESLint + Vitest + production build
      - run: npm run check

  smoke:
    needs: [resolve, check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Use the runner's preinstalled Google Chrome (channel 'chrome'); only WebKit is downloaded (below).
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # e2e/iphone.spec.ts runs in Playwright's WebKit (the runner has no Safari): install just that browser.
      - run: npx playwright install --with-deps webkit
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'
      - run: npm run build
      - run: npm run smoke
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: test-results/
          retention-days: 7

  # Staging: every green push to main, deployed to the preview target and aliased to the one staging
  # host, then smoked there with the same specs. Branches and PRs are never deployed: this is the
  # only deploy that is not production, and the hobby plan has no custom environment to name it.
  staging:
    needs: [resolve, check, smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      STAGING_URL: https://paper-golf-staging-derek-hobden.vercel.app
      # Use the runner's preinstalled Google Chrome; only WebKit is downloaded (below).
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: '[ -n "$VERCEL_TOKEN" ] || { echo "::error::repo secret VERCEL_TOKEN is not set"; exit 1; }'
      - run: npm ci
      - run: npx playwright install --with-deps webkit
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'
      - run: npm install --global "$VERCEL_CLI"
      - run: vercel pull --yes --environment=preview --scope "$VERCEL_SCOPE"
      - run: vercel build --scope "$VERCEL_SCOPE"
      - name: vercel deploy (staging)
        id: deploy
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --scope "$VERCEL_SCOPE")"
          vercel alias set "$url" "${STAGING_URL#https://}" --scope "$VERCEL_SCOPE"
          echo "Staging: $STAGING_URL ($url)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: smoke staging
        env:
          SMOKE_BASE_URL: ${{ env.STAGING_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run smoke
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-smoke-results
          path: test-results/
          retention-days: 7

  # Production: the sha the staging smoke just proved (auto-promote on a push to main), or the
  # emergency dispatch on main with confirm=deploy-production (which skips staging; check + smoke
  # still run on that sha first). The post-promote smoke here is the quick suite alone, so a rollback
  # fires fast; the full suite ran on the PR and on staging. The deployment production serves now is
  # recorded as the last good one before the promote; when the production smoke fails, Vercel is
  # rolled back to it, that deployment is smoked (the full suite, on a deployment that is meant to be
  # good) to prove it is good, and the run fails with one line in the step summary
  # (Gary pings Derek from it). A production run is never cancelled by concurrency.
  production:
    needs: [resolve, check, smoke, staging]
    if: >-
      !cancelled()
      && needs.resolve.result == 'success'
      && needs.check.result == 'success'
      && needs.smoke.result == 'success'
      && ((github.event_name == 'push' && needs.staging.result == 'success')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      && inputs.confirm == 'deploy-production' && needs.staging.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      # Use the runner's preinstalled Google Chrome; only WebKit is downloaded (below).
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: '[ -n "$VERCEL_TOKEN" ] || { echo "::error::repo secret VERCEL_TOKEN is not set"; exit 1; }'
      - run: npm ci
      - run: npx playwright install --with-deps webkit
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'
      - run: npm install --global "$VERCEL_CLI"
      # The deployment to roll back to if the promote turns out bad. One GET, with the token on
      # curl's stdin (-K -), never in argv.
      - name: record the last good production deployment
        id: lastgood
        run: |
          set -euo pipefail
          api="https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=production&state=READY&limit=1"
          body="$(printf 'header = "Authorization: Bearer %s"\nurl = "%s"\n' "$VERCEL_TOKEN" "$api" |
            curl -sS --max-time 20 -K -)"
          last="$(BODY="$body" node -e '
            const first = (JSON.parse(process.env.BODY ?? "{}").deployments ?? [])[0] ?? {};
            console.log("id=" + (first.uid ?? ""));
            console.log("url=" + (first.url ? "https://" + first.url : ""));
          ')"
          printf '%s\n' "$last" | tee -a "$GITHUB_OUTPUT"
      - run: vercel pull --yes --environment=production --scope "$VERCEL_SCOPE"
      - run: vercel build --prod --scope "$VERCEL_SCOPE"
      - name: vercel deploy (production)
        id: deploy
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --scope "$VERCEL_SCOPE")"
          echo "url=$url" >>"$GITHUB_OUTPUT"
          echo "Production: $url ($SHA)" | tee -a "$GITHUB_STEP_SUMMARY"
      # The quick suite (the `@quick` tests in Chrome: the start page and a turn, and a solo round to
      # the scorecard) against what production serves, so a bad promote is rolled back in under two
      # minutes. The full suite has already run twice on this sha: on the PR and on staging. This
      # step's failure must not end the job: the rollback below is the point of running it.
      - name: smoke production
        id: prodsmoke
        continue-on-error: true
        env:
          SMOKE_BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npm run smoke:quick
      - if: steps.prodsmoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-results
          path: test-results/
          retention-days: 7
      - name: roll back to the last good deployment
        if: steps.prodsmoke.outcome == 'failure'
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          LAST_GOOD_ID: ${{ steps.lastgood.outputs.id }}
          LAST_GOOD_URL: ${{ steps.lastgood.outputs.url }}
          BAD_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -uo pipefail
          [ -n "$LAST_GOOD_ID" ] || {
            echo "::error::the production smoke failed on $BAD_URL ($SHA) and there is no earlier production deployment to roll back to"
            echo "Production smoke FAILED on ${SHA:0:12}; no last good deployment to roll back to — production is serving the bad deploy." >>"$GITHUB_STEP_SUMMARY"
            exit 1
          }
          if vercel rollback "$LAST_GOOD_ID" --yes --scope "$VERCEL_SCOPE"; then
            if [ -n "$LAST_GOOD_URL" ] && SMOKE_BASE_URL="$LAST_GOOD_URL" npm run smoke; then
              rolled="rolled back to $LAST_GOOD_ID, green on it"
            else
              rolled="rolled back to $LAST_GOOD_ID, but the smoke is red on it too"
            fi
          else
            rolled="the rollback to $LAST_GOOD_ID itself failed"
          fi
          echo "::error::the production smoke failed on $BAD_URL ($SHA): $rolled"
          echo "Production smoke FAILED on ${SHA:0:12} ($BAD_URL): $rolled." >>"$GITHUB_STEP_SUMMARY"
          exit 1
