name: CI

# The run's name in the Actions list, set for the two dispatch paths alone: it is how
# scripts/ship/reconcile-ci.sh tells them apart, because only the normal one tested main HEAD
# and a dispatch run carries the tip's head_sha either way, so the emergency dispatch of an
# older commit must not be read as a run of the tip. Every other event evaluates to whitespace,
# which GitHub replaces with the run's own default name (the commit message's first line, or
# the pull request's title), so nothing but a dispatch is renamed.
run-name: >-
  ${{ github.event_name != 'workflow_dispatch' && ' '
  || (inputs.sha == '' && inputs.confirm == '' && 'CI reconcile dispatch of main HEAD')
  || format('CI production dispatch of {0}', inputs.sha) }}

# Every PR to main: check + smoke, under those names, so they can be required status checks
# (Claude's review is the third one, .github/workflows/claude-review.yml; signoff is the fourth,
# .github/workflows/signoff.yml).
# Push to main: the same jobs, unless same-tree.sh proves this commit's tree already passed
# check and smoke on the PR that landed it. On any doubt the tests run.
# This workflow does not deploy. A successful push, or the emergency dispatch, uploads
# deploy-request.json; .github/workflows/deploy.yml deploys that sha.
# Normal dispatch path: workflow_dispatch on main with no inputs at all runs this same
# pipeline for main HEAD — check, smoke, then the deploy of that commit, exactly as a push
# to main does. It stands in for the push run GitHub does not start for a merge made with
# its own GITHUB_TOKEN (main d75953a, PR 22); .github/workflows/reconcile-ci.yml dispatches
# it when main HEAD has no CI run.
# Emergency path: workflow_dispatch on main with sha=<full sha> and confirm=deploy-production
# runs check + smoke on that sha first. Paper Golf uses no tags. CLAUDE.md "Ship process".
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Emergency path only — full 40-hex commit on main to deploy to production (Derek's recorded yes). Leave empty to run main HEAD
        required: false
        type: string
      confirm:
        description: Emergency path only — type deploy-production. Leave empty to run main HEAD
        required: false
        type: string

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # A new push to a PR replaces its run; a run on main is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The commit this run checks: the pushed sha, the PR's merge commit (what CI must
  # prove before the merge), main HEAD on the normal dispatch, or the dispatch input
  # after its guards. `mode` says which, and deploy.yml reads it back from the request.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      pull-requests: read
      checks: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      mode: ${{ steps.sha.outputs.mode }}
      skip_tests: ${{ steps.skip.outputs.skip_tests || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: sha
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.sha }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          # push: the pushed commit; pull_request: the merge commit GitHub made for the PR.
          if [ "$EVENT" = push ]; then
            echo "sha=$GITHUB_SHA" >>"$GITHUB_OUTPUT"
            echo "mode=push" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" != workflow_dispatch ]; then
            echo "sha=$GITHUB_SHA" >>"$GITHUB_OUTPUT"
            echo "mode=pr" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::run the production deploy from main"; exit 1; }
          # The normal path: no inputs, so main HEAD, through the whole push pipeline.
          if [ -z "$INPUT_SHA" ] && [ -z "$CONFIRM" ]; then
            echo "sha=$GITHUB_SHA" >>"$GITHUB_OUTPUT"
            echo "mode=reconcile" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$CONFIRM" = deploy-production ] || { echo "::error::confirm must be deploy-production"; exit 1; }
          [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-hex commit"; exit 1; }
          git merge-base --is-ancestor "$INPUT_SHA" origin/main || { echo "::error::$INPUT_SHA is not on main"; exit 1; }
          echo "sha=$INPUT_SHA" >>"$GITHUB_OUTPUT"
          echo "mode=dispatch" >>"$GITHUB_OUTPUT"
      # Push only. A pull request never sets skip_tests, so check and smoke always run
      # there; nor does a dispatch, so the run that stands in for a missing push run
      # always tests the commit it is about to deploy.
      - id: skip
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: bash scripts/ship/same-tree.sh "$SHA"
      - id: request
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          EVENT: ${{ github.event_name }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          jq -n --arg sha "$SHA" --arg event "$EVENT" --arg confirm "${CONFIRM:-}" \
            '{sha:$sha, event:$event, confirm:$confirm}' > deploy-request.json
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          name: deploy-request
          path: deploy-request.json
          retention-days: 1

  check:
    needs: resolve
    if: needs.resolve.result == 'success' && needs.resolve.outputs.skip_tests != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: tests cover src changes
        if: github.event_name == 'pull_request'
        env:
          PR_ACTOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ship/test-touch.sh "$BASE" HEAD
      - run: npm ci
      # typecheck (TS 7) + ESLint + Vitest (one retry, v8 coverage of engine and game) + production build
      - run: npm run check
        env:
          CI_COVERAGE: '1'
      - name: changed-line coverage
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ship/diff-cover.sh "$BASE" HEAD
      # A main commit, pushed or dispatched: the same gate either way.
      - name: changed-line coverage on main
        if: needs.resolve.outputs.mode == 'push' || needs.resolve.outputs.mode == 'reconcile'
        run: bash scripts/ship/diff-cover.sh HEAD^ HEAD
      - name: report tests that passed on retry
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ship/report-flaky.sh flaky-vitest.json

  smoke:
    needs: [resolve, check]
    if: needs.resolve.result == 'success' && needs.resolve.outputs.skip_tests != 'true' && needs.check.result == 'success'
    runs-on: ubuntu-latest
    # The browsers come with the image, so no job here installs one. Installing them was
    # the unpredictable half of this job: its apt step took 52s on one run and 7m40s on
    # another, and on 22 Oct 2026 it hung for 15 and 19 minutes in two deploy jobs
    # (run 39781080561). The suite is ~6.5 min; 20 leaves room for the image pull.
    timeout-minutes: 20
    # Pinned to the @playwright/test version in package-lock.json, which tests/workflows.test.ts
    # holds it to: the browsers in the image are only the right ones at the matching version.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    # A container job's default shell is `sh`, which has no `pipefail`. Every run step
    # here (and the scripts they call) is bash.
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    env:
      # The image carries the browsers; npm ci must not download a second set.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # The container runs as root, where Chromium cannot start its sandbox.
      CHROME_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The image ships Chromium and WebKit, not branded Chrome: point the chrome project at it.
      - run: bash scripts/ship/container-chrome.sh >>"$GITHUB_ENV"
      - run: npm run build
      # 210 tests, 7.7 min in the container on 22 Oct (run 39800842112) — WebKit is slower
      # here than branded Chrome was on the runner. 12 leaves room without being a hang.
      - run: npm run smoke
        timeout-minutes: 12
      # gh and jq are not in the browser image, so the retry record travels to the job below.
      - name: keep the retry record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flaky-playwright
          path: flaky-playwright.json
          if-no-files-found: ignore
          retention-days: 1
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-results
          path: test-results/
          retention-days: 7

  # The flaky issue, on the runner: filing it needs gh and jq, and the browser image carries
  # neither. The smoke job hands over its retry record as an artifact. Opening the issue is
  # all this does — the suite's own verdict is the smoke job's.
  flaky:
    needs: [resolve, smoke]
    if: always() && needs.smoke.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: flaky-playwright
      - name: report tests that passed on retry
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ship/report-flaky.sh flaky-playwright.json

  # Advisory. Reports a Stryker score for changed engine and game files and never fails the run.
  # Not a required check. CLAUDE.md: it becomes blocking after two weeks of usable scores.
  mutation:
    needs: [resolve, check]
    if: github.event_name == 'pull_request' && needs.check.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: stryker on the changed engine and game files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ship/mutate.sh "$BASE" HEAD
