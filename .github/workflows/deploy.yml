name: Deploy

# Staging and production. Runs after CI completes successfully, and only for a main commit:
# a push to main, ci.yml's normal dispatch (which stands in for the push run GitHub does not
# start for a merge made with its own token), or the emergency dispatch on main. Pull
# requests never deploy: `branches: [main]` keeps their CI runs from starting this workflow
# at all.
# A workflow_run run carries main's tip, not the commit the triggering CI run tested, so
# scripts/ship/deploy-gate.sh decides: that run must be green on main and the commit it
# proved must still be what main points at, and that commit is the one deployed. A push run
# main has moved past deploys nothing (the newer run deploys the newer commit).
# One deploy at a time, never cancelled. If a newer commit is already waiting, this run
# does not deploy (only the newest waiting commit does).
# A red production smoke rolls Vercel back. That failure opens a pipeline-failure issue.
# Paper Golf uses no tags. CLAUDE.md "Ship process".
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    # The branch of the CI run that completed. A pull request's CI run is on its own
    # branch, so it never reaches this workflow — and never queues in the deploy group.
    branches: [main]

concurrency:
  # Only a deployable CI run — green, on main, from a push or a dispatch — may enter the
  # one deploy group; every other run gets a group of its own. GitHub keeps one pending
  # run per group, so a run whose jobs all skip used to replace the real deploy waiting
  # there: PR 23 (bd648a0) had a green main CI run and its deploy was cancelled with no
  # jobs, displaced by deploy runs from PR-branch CI completions.
  group: >-
    ${{ (github.event.workflow_run.conclusion == 'success'
    && github.event.workflow_run.head_branch == 'main'
    && (github.event.workflow_run.event == 'push'
    || github.event.workflow_run.event == 'workflow_dispatch'))
    && 'paper-golf-deploy'
    || format('paper-golf-deploy-skipped-{0}', github.event.workflow_run.id) }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Not secrets: the Vercel team and project Derek approved (14 Oct 2026).
  VERCEL_ORG_ID: team_NOIeemLqazmSprS9Y1tgjYx1
  VERCEL_PROJECT_ID: prj_2wXuwwaoThxXs8GAfBfcreeFeWO0
  VERCEL_SCOPE: derek-hobden
  VERCEL_CLI: vercel@61.1.0

jobs:
  prepare:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      mode: ${{ steps.gate.outputs.mode }}
      proceed: ${{ steps.batch.outputs.proceed }}
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - id: batch
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: bash scripts/ship/deploy-batch.sh
      - uses: actions/download-artifact@v8
        if: steps.batch.outputs.proceed == 'true'
        with:
          name: deploy-request
          path: deploy-request
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      # The whole decision: whether this run deploys and which commit. This step
      # only hands the triggering CI run's own fields to the script.
      - id: gate
        if: steps.batch.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_STATUS: ${{ github.event.workflow_run.status }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          CI_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUEST_FILE: deploy-request/deploy-request.json
        run: bash scripts/ship/deploy-gate.sh

  # Staging: a green main commit (pushed, or dispatched through ci.yml's normal path),
  # deployed to the preview target and aliased to the one staging
  # host, then smoked there with the same specs. The hobby plan has no custom environment to name it.
  staging:
    needs: prepare
    if: >-
      needs.prepare.result == 'success'
      && needs.prepare.outputs.proceed == 'true'
      && needs.prepare.outputs.deploy == 'true'
      && ((needs.prepare.outputs.mode == 'push' && github.event.workflow_run.event == 'push')
      || (needs.prepare.outputs.mode == 'reconcile'
      && github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    # Nothing here installs a browser any more, so the job is the image pull, npm ci,
    # the Vercel steps and the ~6.5 minute suite. Every long step has its own, tighter
    # limit below, so a hang is caught by the step rather than by the job.
    timeout-minutes: 15
    # The browsers come with the image, pinned to the @playwright/test version in
    # package-lock.json (tests/workflows.test.ts holds the two together).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    # A container job's default shell is `sh`, which has no `pipefail`.
    defaults:
      run:
        shell: bash
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      STAGING_URL: https://paper-golf-staging-derek-hobden.vercel.app
      # The image carries the browsers; npm ci must not download a second set.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # The container runs as root, where Chromium cannot start its sandbox.
      CHROME_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: '[ -n "$VERCEL_TOKEN" ] || { echo "::error::repo secret VERCEL_TOKEN is not set"; exit 1; }'
      - run: bash scripts/ship/retry.sh --timeout 2m -- npm ci
        timeout-minutes: 6
      # The image ships Chromium and WebKit, not branded Chrome: point the chrome project at it.
      - run: bash scripts/ship/container-chrome.sh >>"$GITHUB_ENV"
      - run: bash scripts/ship/retry.sh --timeout 90s -- npm install --global "$VERCEL_CLI"
        timeout-minutes: 5
      - name: vercel pull (staging)
        timeout-minutes: 5
        run: bash scripts/ship/retry.sh --timeout 75s -- vercel pull --yes --environment=preview --scope "$VERCEL_SCOPE"
      - name: vercel build (staging)
        timeout-minutes: 6
        run: bash scripts/ship/retry.sh --timeout 2m -- vercel build --scope "$VERCEL_SCOPE"
      # retry.sh says what it is doing on stderr, so this still captures the URL alone.
      - name: vercel deploy (staging)
        id: deploy
        timeout-minutes: 6
        run: |
          set -euo pipefail
          url="$(bash scripts/ship/retry.sh --timeout 80s -- vercel deploy --prebuilt --scope "$VERCEL_SCOPE" | tail -n 1)"
          bash scripts/ship/retry.sh --timeout 30s -- vercel alias set "$url" "${STAGING_URL#https://}" --scope "$VERCEL_SCOPE"
          echo "Staging: $STAGING_URL ($url)" | tee -a "$GITHUB_STEP_SUMMARY"
      # The whole suite, once: a failing test is already retried by Playwright itself
      # (playwright.config.ts `retries: 1` in CI), and a second whole run would not fit
      # the job. A suite that stops making progress is cut here, not 20 minutes later.
      - name: smoke staging
        timeout-minutes: 8
        env:
          SMOKE_BASE_URL: ${{ env.STAGING_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run smoke
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: staging-smoke-results
          path: test-results/
          retention-days: 7

  # Production: the sha the staging smoke just proved (a push or the normal dispatch), or the
  # emergency dispatch (which skips staging; CI already ran check + smoke on that sha). The deployment production serves now is
  # recorded before the promote; when the production smoke fails, Vercel is rolled back to it.
  production:
    needs: [prepare, staging]
    if: >-
      !cancelled()
      && needs.prepare.result == 'success'
      && needs.prepare.outputs.proceed == 'true'
      && needs.prepare.outputs.deploy == 'true'
      && (((needs.prepare.outputs.mode == 'push' && github.event.workflow_run.event == 'push')
      || (needs.prepare.outputs.mode == 'reconcile'
      && github.event.workflow_run.event == 'workflow_dispatch'))
      && needs.staging.result == 'success'
      || (needs.prepare.outputs.mode == 'dispatch' && needs.staging.result == 'skipped'
      && github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    # The promote and its @quick smoke take about two minutes; the rollback and its full
    # re-smoke, the longest path, about seven more. 15 covers both with the image pull,
    # and every long step has its own limit below.
    timeout-minutes: 15
    # The browsers come with the image, pinned to the @playwright/test version in
    # package-lock.json (tests/workflows.test.ts holds the two together).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    # A container job's default shell is `sh`, which has no `pipefail`.
    defaults:
      run:
        shell: bash
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      # The image carries the browsers; npm ci must not download a second set.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # The container runs as root, where Chromium cannot start its sandbox.
      CHROME_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: '[ -n "$VERCEL_TOKEN" ] || { echo "::error::repo secret VERCEL_TOKEN is not set"; exit 1; }'
      - run: bash scripts/ship/retry.sh --timeout 2m -- npm ci
        timeout-minutes: 6
      # The image ships Chromium and WebKit, not branded Chrome: point the chrome project at it.
      - run: bash scripts/ship/container-chrome.sh >>"$GITHUB_ENV"
      - run: bash scripts/ship/retry.sh --timeout 90s -- npm install --global "$VERCEL_CLI"
        timeout-minutes: 5
      # The deployment to roll back to if the promote turns out bad. One GET, with the token on
      # curl's stdin (-K -), never in argv.
      - name: record the last good production deployment
        id: lastgood
        timeout-minutes: 2
        run: |
          set -euo pipefail
          api="https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=production&state=READY&limit=1"
          body="$(printf 'header = "Authorization: Bearer %s"\nurl = "%s"\n' "$VERCEL_TOKEN" "$api" |
            curl -sS --max-time 20 -K -)"
          last="$(BODY="$body" node -e '
            const first = (JSON.parse(process.env.BODY ?? "{}").deployments ?? [])[0] ?? {};
            console.log("id=" + (first.uid ?? ""));
            console.log("url=" + (first.url ? "https://" + first.url : ""));
          ')"
          printf '%s\n' "$last" | tee -a "$GITHUB_OUTPUT"
      - name: vercel pull (production)
        timeout-minutes: 5
        run: bash scripts/ship/retry.sh --timeout 75s -- vercel pull --yes --environment=production --scope "$VERCEL_SCOPE"
      - name: vercel build (production)
        timeout-minutes: 6
        run: bash scripts/ship/retry.sh --timeout 2m -- vercel build --prod --scope "$VERCEL_SCOPE"
      # retry.sh says what it is doing on stderr, so this still captures the URL alone.
      - name: vercel deploy (production)
        id: deploy
        timeout-minutes: 6
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          url="$(bash scripts/ship/retry.sh --timeout 80s -- vercel deploy --prebuilt --prod --scope "$VERCEL_SCOPE" | tail -n 1)"
          echo "url=$url" >>"$GITHUB_OUTPUT"
          echo "Production: $url ($SHA)" | tee -a "$GITHUB_STEP_SUMMARY"
      # Fast @quick Chrome check. Those tests fail on a console error or an uncaught page error,
      # so a bad page rolls this deploy back. The failure must not end the job: the rollback is the point.
      - name: smoke production
        id: prodsmoke
        continue-on-error: true
        timeout-minutes: 5
        env:
          SMOKE_BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npm run smoke:quick
      - if: steps.prodsmoke.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: production-smoke-results
          path: test-results/
          retention-days: 7
      # The rollback itself is the first thing this does, so even a cut-short step has
      # already put the last good deployment back; what follows only proves it.
      - name: roll back to the last good deployment
        if: steps.prodsmoke.outcome == 'failure'
        timeout-minutes: 8
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
          LAST_GOOD_ID: ${{ steps.lastgood.outputs.id }}
          LAST_GOOD_URL: ${{ steps.lastgood.outputs.url }}
          BAD_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -uo pipefail
          [ -n "$LAST_GOOD_ID" ] || {
            echo "::error::the production smoke failed on $BAD_URL ($SHA) and there is no earlier production deployment to roll back to"
            echo "Production smoke FAILED on ${SHA:0:12}; no last good deployment to roll back to — production is serving the bad deploy." >>"$GITHUB_STEP_SUMMARY"
            exit 1
          }
          if vercel rollback "$LAST_GOOD_ID" --yes --scope "$VERCEL_SCOPE"; then
            if [ -n "$LAST_GOOD_URL" ] && SMOKE_BASE_URL="$LAST_GOOD_URL" npm run smoke; then
              rolled="rolled back to $LAST_GOOD_ID, green on it"
            else
              rolled="rolled back to $LAST_GOOD_ID, but the smoke is red on it too"
            fi
          else
            rolled="the rollback to $LAST_GOOD_ID itself failed"
          fi
          echo "::error::the production smoke failed on $BAD_URL ($SHA): $rolled"
          echo "Production smoke FAILED on ${SHA:0:12} ($BAD_URL): $rolled." >>"$GITHUB_STEP_SUMMARY"
          exit 1

  notify:
    needs: [prepare, staging, production]
    if: >-
      always() && !cancelled()
      && needs.prepare.outputs.proceed == 'true'
      && needs.prepare.outputs.deploy == 'true'
      && (needs.staging.result == 'failure' || needs.production.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: open a pipeline-failure issue
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RESULT: ${{ needs.staging.result }}
          PRODUCTION_RESULT: ${{ needs.production.result }}
          SHA: ${{ needs.prepare.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/ship/pipeline-failure.sh

  # The last word on every Deploy run, however it went: one line in the run's summary,
  # `LIVE <url> <sha>` or `FAILED <job>`, so what happened is readable without opening a
  # job. It runs even when the deploy jobs were skipped, and never fails a run.
  summary:
    needs: [prepare, staging, production, notify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: one line for the run
        timeout-minutes: 2
        env:
          PREPARE: ${{ needs.prepare.result }}
          STAGING: ${{ needs.staging.result }}
          PRODUCTION: ${{ needs.production.result }}
          DEPLOY: ${{ needs.prepare.outputs.deploy }}
          SHA: ${{ needs.prepare.outputs.sha }}
          URL: ${{ needs.production.outputs.url }}
        run: bash scripts/ship/deploy-summary.sh
