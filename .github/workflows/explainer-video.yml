name: Explainer video

# Narrate, mux and upload a pull request's explainer. The workflow file that
# runs is the one on the default branch (pull_request_target, plus a schedule
# for a video branch pushed after the last synchronize). It checks out that
# branch and reads qa-video/<head> with git archive. It does not run the pull
# request's code, and it is not a push or a workflow_dispatch, so a branch
# cannot bring its own copy of this file in to see the speech key.
# A bare https://github.com/user-attachments/assets/ URL is what GitHub plays
# inline. An installation token is answered 404 there (cli/cli#14309); the
# script records that and leaves the branch and the body alone.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: explainer-${{ github.event.pull_request.number || 'scan' }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: ffmpeg
        timeout-minutes: 2
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: publish the explainer
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          VIDEO_GITHUB_TOKEN: ${{ secrets.VIDEO_GITHUB_TOKEN }}
          SHIP_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_ACTOR: ${{ github.event.pull_request.user.login }}
        run: bash scripts/ship/pr-video-publish.sh
