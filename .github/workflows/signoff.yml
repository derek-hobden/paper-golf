name: Sign-off

# risk:low passes. risk:high passes when derek-hobden has an APPROVED review on
# the current head commit. A new push dismisses that approval. The signed-off
# label remains the fallback when a bot relays his approval and he adds it.
# Re-runs on that review (submitted or dismissed) and on the label, so a pull
# request already set to auto-merge merges on his Approve click once the other
# required checks are green. CLAUDE.md "Ship process".
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]
  # No branches filter: actionlint rejects it on pull_request_review.
  # The job below ignores a review whose base is not main.
  pull_request_review:
    types: [submitted, dismissed]
  # A GITHUB_TOKEN branch update starts no pull_request workflow. update-pr-branches.sh
  # dispatches this with the pull request number; the payload is empty, so the fields
  # come from the API. The workflow file is the one on the pull request ref.
  workflow_dispatch:
    inputs:
      refresh_pr:
        description: Pull request number whose sign-off to re-run
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  signoff:
    if: github.event_name != 'pull_request_review' || github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A pull request checks out its head. A refresh dispatches the branch, so github.sha
      # is already that head; the script that reads the pull request is on it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: fields
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.refresh_pr }}
        run: bash scripts/ship/pr-refresh-fields.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: derek-hobden approved the current head, or added signed-off
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || steps.fields.outputs.base }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR: ${{ github.event.pull_request.number || inputs.refresh_pr }}
        run: bash scripts/ship/signoff.sh "$BASE" "$HEAD" "$PR"
