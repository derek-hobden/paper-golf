name: Sign-off

# Passes when derek-hobden has an APPROVED review of the current head, or a
# pull request comment from him whose text is exactly /approve and which was
# posted after that commit. A new push dismisses an approval of an older
# commit. There is no signed-off label. pull_request_target runs this file
# from the default branch, so a pull request that edits it cannot replace the
# check on a push. A review or a comment re-runs it, and a pull request
# already set to auto-merge then merges once the other required checks are
# green. He does not click Merge.
# CLAUDE.md "Ship process".
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  # No branches filter: actionlint rejects it on pull_request_review.
  # The job below ignores a review whose base is not main.
  pull_request_review:
    types: [submitted, edited, dismissed]
  # A comment on the pull request. issue_comment also fires for issues; the
  # job ignores those. No branches filter: actionlint rejects it here.
  issue_comment:
    types: [created, edited, deleted]
  # A GITHUB_TOKEN branch update starts no pull_request_target workflow.
  # update-pr-branches.sh dispatches this on main with the pull request number.
  workflow_dispatch:
    inputs:
      refresh_pr:
        description: Pull request number whose sign-off to re-run
        required: true
        type: string

concurrency:
  group: signoff-${{ github.event.pull_request.number || github.event.issue.number || inputs.refresh_pr }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read
  checks: write

jobs:
  signoff:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The base, or this workflow's own commit on main. Never the head.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 1
      - id: fields
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number || inputs.refresh_pr }}
        run: bash scripts/ship/pr-refresh-fields.sh
      # issue_comment does not say which branch the pull request targets.
      - id: base
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          ref="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.base.ref')"
          if [ "$ref" = main ]; then echo "ok=1" >>"$GITHUB_OUTPUT"; else echo "ok=0" >>"$GITHUB_OUTPUT"; fi
      - name: derek-hobden approved this head
        id: gate
        if: github.event_name != 'issue_comment' || steps.base.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha || steps.fields.outputs.head }}
          PR: ${{ github.event.pull_request.number || inputs.refresh_pr || github.event.issue.number }}
        run: bash scripts/ship/signoff.sh "$HEAD" "$PR"
      # A dispatch or a comment runs off the pull request head, so the job's
      # own check is not the one branch protection reads. Record it there.
      # issue_comment is not an event whose job check counts as a required one.
      - name: record signoff on the pull request head
        if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && steps.base.outputs.ok == '1'))
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ steps.fields.outputs.head }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          set -euo pipefail
          [ -n "$HEAD" ] || exit 1
          conclusion=failure
          summary="Sign-off did not pass."
          if [ "$GATE_OUTCOME" = success ]; then
            conclusion=success
            summary="derek-hobden approved this head."
          fi
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -n --arg sha "$HEAD" --arg conclusion "$conclusion" --arg now "$now" --arg url "$url" --arg summary "$summary" \
            '{name:"signoff", head_sha:$sha, status:"completed", conclusion:$conclusion, started_at:$now, completed_at:$now, details_url:$url, output:{title:"Sign-off", summary:$summary}}' \
            | gh api --method POST "/repos/${GITHUB_REPOSITORY}/check-runs" --input -
