name: Update branches

# When main moves, an open pull request with auto-merge on that is behind main
# is brought up to date and its checks are dispatched again. A push made with
# GITHUB_TOKEN does not start pull_request workflows, so the dispatch is what
# re-runs check, smoke and claude-review. This file is the one on
# main: it checks out main and never a pull request. CLAUDE.md "Ship process".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-pr-branches
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: update auto-merge pull requests that are behind main
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ship/update-pr-branches.sh
