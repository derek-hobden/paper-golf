<!doctype html>
<html lang="en" class="boot">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d9b789" />
    <meta name="description" content="Paper Golf — a pencil-and-dice notepad golf game. 18-hole rounds of par-72 golf on 90 holes, pass-and-play for up to 4." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23a6e22e'/%3E%3Ccircle cx='11' cy='21' r='5' fill='none' stroke='%23202020' stroke-width='2.6'/%3E%3Ccircle cx='22' cy='10' r='5' fill='%23202020'/%3E%3C/svg%3E" />
    <title>Paper Golf</title>
  </head>
  <body>
    <!-- One wire loop of the spiral binding (src/main.ts repeats it across the top of the page; style.css .coil). The
         page's top edge is at y=16: the wire comes up out of the punched hole over the front, arcs over the edge and
         goes back down behind the paper, so the back leg stops at the edge. -->
    <svg class="defs" aria-hidden="true" focusable="false">
      <symbol id="coil" viewBox="0 0 12 40">
        <ellipse cx="7.1" cy="29" rx="4.7" ry="4" fill="#fff" opacity="0.7" />
        <ellipse cx="7" cy="28" rx="4.6" ry="3.9" fill="#3c3b3f" />
        <ellipse cx="7.1" cy="28.5" rx="3.4" ry="2.9" fill="#131315" />
        <g fill="none" stroke-linecap="round">
          <path d="M2.6 16.6C2.3 12 2.2 6 3.4 3" stroke="#1c1c1f" stroke-width="2.9" />
          <path d="M2.6 15v1.6" stroke="#000" stroke-width="2.9" opacity="0.45" />
          <path d="M7.2 27C7.3 20 7.4 10 6.9 4.6" stroke="#5a3e22" stroke-width="3.2" opacity="0.2" transform="translate(1.5 1.2)" />
          <path d="M7.2 28C7.3 20 7.4 10 6.9 4.6 6.5 1 3.9 0.6 3.4 3" stroke="#101012" stroke-width="3.1" />
          <path d="M8.3 25C8.4 19 8.4 12 8 7" stroke="#9a9aa2" stroke-width="0.6" opacity="0.5" />
          <path d="M6.7 13C6.8 9.8 6.7 7 6.3 5" stroke="#fff" stroke-width="0.75" opacity="0.8" />
          <path d="M4.4 2.1C5 1.7 5.8 1.8 6.2 2.4" stroke="#fff" stroke-width="0.5" opacity="0.45" />
        </g>
      </symbol>
    </svg>
    <div id="desk">
      <div class="notebook" id="notebook">
        <div class="spine" aria-hidden="true"></div>
        <div class="stack" aria-hidden="true"></div>
        <section class="page" id="page" aria-live="polite"></section>
        <div class="spiral" id="spiral" aria-hidden="true"></div>
        <div class="cover" id="cover"></div>
      </div>
      <aside class="tray" id="tray"></aside>
    </div>
    <div id="fx" aria-hidden="true"></div>
    <div id="banner" class="banner" role="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
